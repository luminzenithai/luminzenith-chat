<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuminZenith AI</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh;}
header{background:#111;padding:15px;text-align:center;color:gold;font-size:22px;font-weight:bold;border-bottom:2px solid gold;}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;}
.msg-user{background:#1a1a2e;padding:10px 15px;border-radius:15px;align-self:flex-end;max-width:70%;border:1px solid #333;white-space:pre-wrap;}
.msg-ai{background:#111;padding:10px 15px;border-radius:15px;align-self:flex-start;max-width:70%;border:1px solid gold;color:gold;white-space:pre-wrap;}
#input-area{display:flex;padding:15px;background:#111;border-top:1px solid #333;gap:10px;}
#msg{flex:1;background:#1a1a1a;border:1px solid gold;color:#fff;padding:12px;border-radius:8px;font-size:16px;}
#send{background:gold;color:#000;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;}
.loading{color:#888;font-style:italic;}
</style>
</head>
<body>
<header>✦ LuminZenith AI</header>
<div id="messages">
  <div class="msg-ai">Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?</div>
</div>
<div id="input-area">
  <input id="msg" type="text" placeholder="Écrivez votre message..." onkeypress="if(event.key==='Enter')envoyer()">
  <button id="send" onclick="envoyer()">Envoyer</button>
</div>
<script>
const WEBHOOK = 'https://hook.eu1.make.com/tfhznbelwr7yic3gh7wlud08clfng9s5';

function escapeHtml(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function envoyer(){
  const msg = document.getElementById('msg');
  const messages = document.getElementById('messages');
  const texte = msg.value.trim();
  if(!texte) return;
  messages.innerHTML += `<div class="msg-user">${escapeHtml(texte)}</div>`;
  msg.value = '';
  messages.innerHTML += `<div class="msg-ai loading" id="loading">LuminZenith réfléchit...</div>`;
  messages.scrollTop = messages.scrollHeight;
  try {
    const r = await fetch(WEBHOOK, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: texte })
    });
    const rep = await r.text();
    document.getElementById('loading').remove();
    messages.innerHTML += `<div class="msg-ai">${escapeHtml(rep)}</div>`;
  } catch(e) {
    document.getElementById('loading').textContent = 'Erreur de connexion.';
  }
  messages.scrollTop = messages.scrollHeight;
}
</script>
</body>
</html>
