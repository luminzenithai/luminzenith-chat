<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuminZenith AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh;}
header{background:#111;padding:15px;text-align:center;color:gold;font-size:22px;font-weight:bold;border-bottom:2px solid gold;}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
.msg-user{background:#1a1a2e;padding:12px 16px;border-radius:15px;align-self:flex-end;max-width:75%;border:1px solid #333;word-wrap:break-word;}
.msg-ai{background:#111;padding:12px 16px;border-radius:15px;align-self:flex-start;max-width:75%;border:1px solid gold;color:gold;word-wrap:break-word;white-space:pre-wrap;}
.loading{color:#666;font-style:italic;}
#input-area{display:flex;padding:15px;background:#111;border-top:1px solid #333;gap:10px;}
#msg{flex:1;background:#1a1a1a;border:1px solid gold;color:#fff;padding:12px;border-radius:8px;font-size:16px;outline:none;}
#send{background:gold;color:#000;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;}
#send:hover{background:#ffd700;}
</style>
</head>
<body>
<header>✦ LuminZenith AI</header>
<div id="messages">
  <div class="msg-ai">Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?</div>
</div>
<div id="input-area">
  <input id="msg" type="text" placeholder="Écrivez votre message..." onkeypress="if(event.key==='Enter')envoyer()">
  <button id="send" onclick="envoyer()">Envoyer</button>
</div>
<script>
const WORKER = 'https://luminzenithai-api.luminzenithai.workers.dev';

async function envoyer(){
  const input = document.getElementById('msg');
  const zone = document.getElementById('messages');
  const texte = input.value.trim();
  if(!texte) return;

  zone.innerHTML += `<div class="msg-user">${texte}</div>`;
  input.value = '';
  zone.innerHTML += `<div class="msg-ai loading" id="loading">LuminZenith réfléchit...</div>`;
  zone.scrollTop = zone.scrollHeight;

  try {
    const r = await fetch(WORKER, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: texte })
    });
    const rep = await r.text();
    document.getElementById('loading').remove();
    zone.innerHTML += `<div class="msg-ai">${rep}</div>`;
  } catch(e) {
    document.getElementById('loading').textContent = 'Erreur de connexion.';
  }
  zone.scrollTop = zone.scrollHeight;
}
</script>
</body>
</html>
