<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuminZenith AI - Chat</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh;}

#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center, #1a1208 0%, #0a0a0a 60%, #000 100%);z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity 0.8s ease;}
#splash.fade-out{opacity:0;pointer-events:none;}
#stars{position:absolute;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(1px 1px at 20% 30%, #fff, transparent),radial-gradient(1px 1px at 60% 70%, #fff, transparent),radial-gradient(1px 1px at 80% 20%, #fff, transparent),radial-gradient(1px 1px at 40% 80%, #fff, transparent),radial-gradient(1px 1px at 90% 50%, #fff, transparent),radial-gradient(1px 1px at 10% 60%, #fff, transparent),radial-gradient(1px 1px at 50% 10%, #fff, transparent),radial-gradient(1px 1px at 30% 90%, #fff, transparent),radial-gradient(1px 1px at 70% 40%, #fff, transparent),radial-gradient(1px 1px at 15% 15%, #fff, transparent);background-size:200% 200%;animation:twinkle 4s ease-in-out infinite alternate;}
@keyframes twinkle{0%{opacity:0.3;}100%{opacity:1;}}
#splash-content{text-align:center;z-index:1;}
#splash-logo{width:140px;height:auto;margin:0 auto 20px;filter:drop-shadow(0 0 25px rgba(184,134,11,0.6));}
#splash-title{font-family:Georgia,serif;font-size:34px;font-weight:bold;margin:0;background:linear-gradient(90deg,#fff,#D4AF37,#fff);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shine 3s linear infinite;}
@keyframes shine{to{background-position:200% center;}}
#splash-tagline{color:#B8860B;font-size:15px;letter-spacing:2px;margin-top:10px;text-transform:uppercase;}

header{background:#111;padding:15px;text-align:center;color:gold;font-size:22px;font-weight:bold;border-bottom:2px solid gold;position:relative;}
#newconv{position:absolute;top:15px;right:15px;background:gold;color:#000;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px;}
#convlist{position:absolute;top:15px;left:15px;background:#1a1a1a;color:gold;border:1px solid gold;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px;}
#sidebar{position:fixed;top:0;left:-300px;width:280px;height:100vh;background:#111;border-right:1px solid gold;padding:15px;transition:left 0.3s;overflow-y:auto;z-index:10;}
#sidebar.open{left:0;}
#sidebar h3{color:gold;margin-top:0;}
.conv-item{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;color:#fff;border:1px solid #333;}
.conv-item:hover{background:#222;}
.conv-item.active{border-color:gold;color:gold;}
#overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:5;}
#overlay.open{display:block;}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;}
.msg-user{background:#1a1a2e;padding:10px 15px;border-radius:15px;align-self:flex-end;max-width:70%;border:1px solid #333;}
.msg-ai{background:#111;padding:10px 15px;border-radius:15px;align-self:flex-start;max-width:70%;border:1px solid gold;color:gold;}
#input-area{display:flex;padding:15px;background:#111;border-top:1px solid #333;gap:10px;}
#msg{flex:1;background:#1a1a1a;border:1px solid gold;color:#fff;padding:12px;border-radius:8px;font-size:16px;}
#send{background:gold;color:#000;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;}
.loading{color:#888;font-style:italic;}
</style>
</head>
<body>

<div id="splash">
  <div id="stars"></div>
  <div id="splash-content">
    <img id="splash-logo" src="LuminZenith AI.png" alt="LuminZenith AI">
    <h1 id="splash-title">LuminZenith AI</h1>
    <p id="splash-tagline">La lumière au sommet</p>
  </div>
</div>

<div id="overlay" onclick="fermerSidebar()"></div>
<div id="sidebar">
<h3>Conversations</h3>
<div id="convItems"></div>
</div>
<header>
<button id="convlist" onclick="ouvrirSidebar()">☰ Conversations</button>
✦ LuminZenith AI
<button id="newconv" onclick="nouvelleConv()">+ Nouvelle conversation</button>
</header>
<div id="messages">
<div class="msg-ai">Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?</div>
</div>
<div id="input-area">
<input id="msg" type="text" placeholder="Écrivez votre message..." onkeypress="if(event.key==='Enter')envoyer()">
<button id="send" onclick="envoyer()">Envoyer</button>
</div>

<script>
setTimeout(() => {
  document.getElementById('splash').classList.add('fade-out');
}, 2500);

const WORKER = 'https://luminzenithai-api.luminzenithai.workers.dev';

function getUserId() {
  let id = localStorage.getItem('luminzenith_uid');
  if (!id) {
    id = 'user_' + Math.random().toString(36).substring(2) + Date.now();
    localStorage.setItem('luminzenith_uid', id);
  }
  return id;
}
const userId = getUserId();

function getConversationsList() {
  const list = localStorage.getItem('luminzenith_convs');
  return list ? JSON.parse(list) : [];
}
function saveConversationsList(list) {
  localStorage.setItem('luminzenith_convs', JSON.stringify(list));
}
function creerNouvelleConversation() {
  const id = 'conv_' + Date.now();
  const list = getConversationsList();
  list.push({ id: id, titre: 'Nouvelle conversation' });
  saveConversationsList(list);
  localStorage.setItem('luminzenith_current_conv', id);
  return id;
}
function getCurrentConversationId() {
  let id = localStorage.getItem('luminzenith_current_conv');
  if (!id) {
    id = creerNouvelleConversation();
  }
  return id;
}
function nouvelleConv() {
  creerNouvelleConversation();
  location.reload();
}
function ouvrirConversation(id) {
  localStorage.setItem('luminzenith_current_conv', id);
  location.reload();
}
function ouvrirSidebar() {
  afficherListeConversations();
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function fermerSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
function afficherListeConversations() {
  const list = getConversationsList();
  const current = getCurrentConversationId();
  const container = document.getElementById('convItems');
  container.innerHTML = '';
  list.slice().reverse().forEach(c => {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.id === current ? ' active' : '');
    div.textContent = c.titre;
    div.onclick = () => ouvrirConversation(c.id);
    container.appendChild(div);
  });
  if (list.length === 0) {
    container.innerHTML = '<p style="color:#888;">Aucune conversation encore.</p>';
  }
}

let conversationId = getCurrentConversationId();
const historique = [];

function mettreAJourTitreConversation(premierMessage) {
  const list = getConversationsList();
  const conv = list.find(c => c.id === conversationId);
  if (conv && conv.titre === 'Nouvelle conversation') {
    conv.titre = premierMessage.substring(0, 30) + (premierMessage.length > 30 ? '...' : '');
    saveConversationsList(list);
  }
}

async function chargerHistorique() {
  try {
    const r = await fetch(WORKER, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ messages: [], userId: userId, conversationId: conversationId, chargerSeulement: true })
    });
    const data = await r.json();
    if (data.historique && data.historique.length > 0) {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '';
      data.historique.forEach(m => {
        const classe = m.role === 'user' ? 'msg-user' : 'msg-ai';
        const contenu = m.role === 'user' ? m.content : m.content.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        messagesDiv.innerHTML += `<div class="${classe}">${contenu}</div>`;
      });
    }
  } catch(e) { console.log('Pas d\'historique existant.'); }
}
chargerHistorique();

async function envoyer(){
  const msg = document.getElementById('msg');
  const messages = document.getElementById('messages');
  const texte = msg.value.trim();
  if(!texte) return;
  messages.innerHTML += `<div class="msg-user">${texte}</div>`;
  msg.value = '';
  historique.push({ role: "user", content: texte });
  mettreAJourTitreConversation(texte);
  messages.innerHTML += `<div class="msg-ai loading" id="loading">LuminZenith réfléchit...</div>`;
  messages.scrollTop = messages.scrollHeight;
  try {
    const r = await fetch(WORKER, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ messages: historique, userId: userId, conversationId: conversationId })
    });
    const rep = await r.text();
    document.getElementById('loading').remove();
    historique.push({ role: "assistant", content: rep });
    const repFormatee = rep.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    messages.innerHTML += `<div class="msg-ai">${repFormatee}</div>`;
  } catch(e) {
    document.getElementById('loading').textContent = 'Erreur de connexion.';
  }
  messages.scrollTop = messages.scrollHeight;
}
</script>
</body>
</html>
