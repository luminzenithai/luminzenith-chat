<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuminZenith AI</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#050403;}
.font-display{font-family:'Playfair Display',serif;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#4a3a15;border-radius:10px;}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.star{animation:twinkle 3s ease-in-out infinite;}
@keyframes shine{to{background-position:200% center;}}
.text-shine{background:linear-gradient(90deg,#fff,#D4AF37,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const WORKER = 'https://luminzenithai-api.luminzenithai.workers.dev';

function getUserId() {
  let id = localStorage.getItem('luminzenith_uid');
  if (!id) {
    id = 'user_' + Math.random().toString(36).substring(2) + Date.now();
    localStorage.setItem('luminzenith_uid', id);
  }
  return id;
}

function getConversationsList() {
  const list = localStorage.getItem('luminzenith_convs');
  return list ? JSON.parse(list) : [];
}
function saveConversationsList(list) {
  localStorage.setItem('luminzenith_convs', JSON.stringify(list));
}
function creerNouvelleConversation() {
  const id = 'conv_' + Date.now();
  const list = getConversationsList();
  list.push({ id, titre: 'Nouvelle conversation' });
  saveConversationsList(list);
  localStorage.setItem('luminzenith_current_conv', id);
  return id;
}
function getCurrentConversationId() {
  let id = localStorage.getItem('luminzenith_current_conv');
  if (!id) id = creerNouvelleConversation();
  return id;
}

function Splash({ onDone }) {
  const [fade, setFade] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setFade(true), 2200);
    const t2 = setTimeout(onDone, 3000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  const stars = Array.from({ length: 40 }, (_, i) => ({
    top: Math.random() * 100, left: Math.random() * 100, delay: Math.random() * 3
  }));
  return (
    <div className={`fixed inset-0 z-50 flex items-center justify-center bg-gradient-radial transition-opacity duration-700 ${fade ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
      style={{ background: 'radial-gradient(circle at center, #241a0a 0%, #0a0703 55%, #000 100%)' }}>
      {stars.map((s, i) => (
        <div key={i} className="star absolute w-[2px] h-[2px] bg-white rounded-full"
          style={{ top: s.top + '%', left: s.left + '%', animationDelay: s.delay + 's' }} />
      ))}
      <div className="text-center z-10">
        <img src="LuminZenith AI.png" alt="LuminZenith AI"
          className="w-32 h-32 mx-auto mb-6 drop-shadow-[0_0_35px_rgba(212,175,55,0.6)]" />
        <h1 className="font-display text-shine text-4xl font-bold mb-2">LuminZenith AI</h1>
        <p className="text-amber-600 text-xs tracking-[3px] uppercase">La lumière au sommet</p>
      </div>
    </div>
  );
}

function Sidebar({ onOpenConversations }) {
  const items = [
    { icon: '🏠', label: 'Accueil', active: true },
    { icon: '💬', label: 'Messages', onClick: onOpenConversations },
    { icon: '📞', label: 'Appels / Visio' },
    { icon: '📈', label: 'Activité' },
    { icon: '👤', label: 'Profil' },
  ];
  return (
    <div className="w-16 md:w-60 shrink-0 flex flex-col py-6 border-r border-amber-900/20"
      style={{ background: 'linear-gradient(180deg,#120d05,#0a0704 60%,#050302)' }}>
      <div className="flex items-center gap-3 px-3 md:px-5 pb-5 mb-4 border-b border-amber-900/20 justify-center md:justify-start">
        <img src="LuminZenith AI.png" alt="logo" className="w-10 h-10 rounded-lg shadow-[0_0_18px_rgba(212,175,55,0.5)]" />
        <div className="hidden md:block">
          <div className="font-display text-amber-200 font-semibold text-sm leading-tight">LuminZenith AI</div>
          <div className="text-amber-800 text-[9px] tracking-widest">LA LUMIÈRE AU SOMMET</div>
        </div>
      </div>
      {items.map((it, i) => (
        <div key={i} onClick={it.onClick}
          className={`flex items-center gap-3 px-3 md:px-5 py-3 cursor-pointer text-sm border-l-2 justify-center md:justify-start transition-colors
            ${it.active ? 'border-amber-500 text-amber-200 bg-amber-500/10' : 'border-transparent text-stone-400 hover:text-amber-200 hover:bg-amber-500/5'}`}>
          <span className="text-lg drop-shadow-[0_0_4px_rgba(212,175,55,0.4)]">{it.icon}</span>
          <span className="hidden md:inline">{it.label}</span>
        </div>
      ))}
    </div>
  );
}

function ConversationsPanel({ open, onClose, current, onSelect }) {
  const list = getConversationsList().slice().reverse();
  return (
    <>
      <div onClick={onClose}
        className={`fixed inset-0 bg-black/60 backdrop-blur-sm z-30 transition-opacity ${open ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} />
      <div className={`fixed top-0 left-16 md:left-60 w-72 h-full z-40 p-4 border-r border-amber-900/30 transition-transform duration-300
          ${open ? 'translate-x-0' : '-translate-x-full'}`}
        style={{ background: 'linear-gradient(180deg,#120d05,#0a0704)' }}>
        <h3 className="font-display text-amber-200 text-lg mb-4">Conversations</h3>
        {list.length === 0 && <p className="text-stone-600 text-sm">Aucune conversation encore.</p>}
        {list.map(c => (
          <div key={c.id} onClick={() => onSelect(c.id)}
            className={`p-3 rounded-lg mb-2 cursor-pointer text-sm border transition-colors
              ${c.id === current ? 'border-amber-500 text-amber-200 shadow-[0_0_12px_rgba(212,175,55,0.2)]' : 'border-amber-900/20 text-stone-300 bg-black/30 hover:border-amber-700'}`}>
            {c.titre}
          </div>
        ))}
      </div>
    </>
  );
}

const QUICK_ACTIONS = [
  { icon: '💰', label: 'Business', prompt: "Aide-moi sur le business et la stratégie : " },
  { icon: '📱', label: 'Réseaux sociaux', prompt: "Aide-moi sur les réseaux sociaux : " },
  { icon: '📊', label: 'Investissement', prompt: "Aide-moi sur l'investissement : " },
  { icon: '🎨', label: 'Création', prompt: "Aide-moi sur la création et le design : " },
  { icon: '⚡', label: 'Automatisation', prompt: "Aide-moi à automatiser : " },
];

function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [convOpen, setConvOpen] = useState(false);
  const [conversationId, setConversationId] = useState(getCurrentConversationId());
  const [messages, setMessages] = useState([
    { role: 'assistant', content: "Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?" }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const userId = useRef(getUserId()).current;
  const scrollRef = useRef(null);

  useEffect(() => { chargerHistorique(); }, [conversationId]);
  useEffect(() => { scrollRef.current?.scrollTo(0, scrollRef.current.scrollHeight); }, [messages, loading]);

  async function chargerHistorique() {
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [], userId, conversationId, chargerSeulement: true })
      });
      const data = await r.json();
      if (data.historique && data.historique.length > 0) {
        setMessages(data.historique);
      } else {
        setMessages([{ role: 'assistant', content: "Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?" }]);
      }
    } catch (e) { console.log('Pas d\'historique existant.'); }
  }

  function mettreAJourTitreConversation(premierMessage) {
    const list = getConversationsList();
    const conv = list.find(c => c.id === conversationId);
    if (conv && conv.titre === 'Nouvelle conversation') {
      conv.titre = premierMessage.substring(0, 30) + (premierMessage.length > 30 ? '...' : '');
      saveConversationsList(list);
    }
  }

  async function envoyer(texteOverride) {
    const texte = (texteOverride ?? input).trim();
    if (!texte) return;
    const nouvHist = [...messages, { role: 'user', content: texte }];
    setMessages(nouvHist);
    setInput('');
    mettreAJourTitreConversation(texte);
    setLoading(true);
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: nouvHist, userId, conversationId })
      });
      const rep = await r.text();
      setMessages(h => [...h, { role: 'assistant', content: rep }]);
    } catch (e) {
      setMessages(h => [...h, { role: 'assistant', content: 'Erreur de connexion.' }]);
    }
    setLoading(false);
  }

  function nouvelleConv() {
    const id = creerNouvelleConversation();
    setConversationId(id);
    setConvOpen(false);
  }
  function ouvrirConversation(id) {
    localStorage.setItem('luminzenith_current_conv', id);
    setConversationId(id);
    setConvOpen(false);
  }
  function formatMsg(text) {
    return text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  }

  return (
    <div className="flex h-screen text-white overflow-hidden">
      {showSplash && <Splash onDone={() => setShowSplash(false)} />}
      <Sidebar onOpenConversations={() => setConvOpen(true)} />
      <ConversationsPanel open={convOpen} onClose={() => setConvOpen(false)} current={conversationId} onSelect={ouvrirConversation} />

      <div className="flex-1 flex flex-col min-w-0" style={{ background: 'radial-gradient(circle at 50% 0%,#140f06 0%,#050505 60%)' }}>
        <header className="relative text-center py-4 px-5 border-b border-amber-900/30 shadow-lg"
          style={{ background: 'linear-gradient(180deg,#161008,#0d0a05)' }}>
          <button onClick={() => setConvOpen(true)}
            className="absolute left-4 top-1/2 -translate-y-1/2 border border-amber-800/50 text-amber-300 text-xs px-3 py-2 rounded-lg hover:border-amber-500 transition-colors">
            ☰ Conversations
          </button>
          <span className="font-display text-shine text-xl font-bold">✦ LuminZenith AI</span>
          <button onClick={nouvelleConv}
            className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-semibold px-4 py-2 rounded-lg text-amber-950 shadow-[0_0_14px_rgba(212,175,55,0.4)] hover:shadow-[0_0_22px_rgba(212,175,55,0.7)] transition-shadow"
            style={{ background: 'linear-gradient(135deg,#f0d580,#b8860b)' }}>
            + Nouvelle conversation
          </button>
        </header>

        <div className="flex gap-3 overflow-x-auto px-5 py-4 border-b border-amber-900/10">
          {QUICK_ACTIONS.map((qa, i) => (
            <div key={i} onClick={() => setInput(qa.prompt)}
              className="min-w-[110px] shrink-0 text-center rounded-xl border border-amber-900/40 px-3 py-4 cursor-pointer text-amber-300 text-xs hover:border-amber-500 hover:shadow-[0_0_18px_rgba(212,175,55,0.3)] hover:-translate-y-0.5 transition-all"
              style={{ background: 'linear-gradient(145deg,#1c1509,#0d0a05)' }}>
              <div className="text-2xl mb-2 drop-shadow-[0_0_6px_rgba(212,175,55,0.5)]">{qa.icon}</div>
              {qa.label}
            </div>
          ))}
        </div>

        <div ref={scrollRef} className="flex-1 overflow-y-auto px-5 py-5 flex flex-col gap-3">
          {messages.map((m, i) => (
            <div key={i}
              className={`max-w-[70%] px-4 py-3 rounded-2xl text-sm leading-relaxed
                ${m.role === 'user'
                  ? 'self-end bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700'
                  : 'self-start border border-amber-800/40 text-amber-100'}`}
              style={m.role === 'assistant' ? { background: 'linear-gradient(145deg,#161108,#0d0a05)' } : {}}
              dangerouslySetInnerHTML={{ __html: formatMsg(m.content) }} />
          ))}
          {loading && <div className="self-start text-amber-700 italic text-sm px-4">LuminZenith réfléchit...</div>}
        </div>

        <div className="flex gap-3 p-4 border-t border-amber-900/20" style={{ background: 'linear-gradient(180deg,#0d0a05,#0a0703)' }}>
          <input value={input} onChange={e => setInput(e.target.value)}
            onKeyPress={e => e.key === 'Enter' && envoyer()}
            placeholder="Écrivez votre message..."
            className="flex-1 bg-[#120d06] border border-amber-900/40 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 focus:shadow-[0_0_14px_rgba(212,175,55,0.25)]" />
          <button onClick={() => envoyer()}
            className="px-6 py-3 rounded-lg font-semibold text-amber-950 text-sm shadow-[0_0_16px_rgba(212,175,55,0.4)] hover:shadow-[0_0_26px_rgba(212,175,55,0.7)] hover:-translate-y-0.5 transition-all"
            style={{ background: 'linear-gradient(135deg,#f0d580,#b8860b)' }}>
            Envoyer
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
