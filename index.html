<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuminZenith AI</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{overflow-x:hidden!important;width:100%!important;max-width:100%!important;}
body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;overflow-x:hidden!important;font-family:'Source Serif 4',serif;background:#000;}
*{box-sizing:border-box;min-width:0;}
#root{width:100%;max-width:100%;overflow-x:hidden;}
.font-display{font-family:'Libre Bodoni',serif;letter-spacing:0.5px;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#5a3d2c;border-radius:10px;}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(0.6)}50%{opacity:1;transform:scale(1.6)}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-20px)}}
.star{animation:twinkle var(--dur,2.5s) ease-in-out infinite, drift var(--driftDur,7s) ease-in-out infinite alternate;}
@keyframes shoot{0%{transform:translate(0,0) rotate(-35deg);opacity:0}8%{opacity:1}30%{transform:translate(240px,170px) rotate(-35deg);opacity:0}100%{opacity:0}}
.shooting-star{animation:shoot linear infinite;}
@keyframes shine{to{background-position:200% center;}}
.text-shine{background:linear-gradient(90deg,#8c5a3f,#e8c9b0,#8c5a3f);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;}
@keyframes pulseglow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
.glow-ring{animation:pulseglow 3.5s ease-in-out infinite;}
.logo-fade{
  -webkit-mask-image:radial-gradient(circle, black 45%, transparent 78%);
  mask-image:radial-gradient(circle, black 45%, transparent 78%);
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const WORKER = 'https://luminzenithai-api.luminzenithai.workers.dev';

function getUserId() {
  let id = localStorage.getItem('luminzenith_uid');
  if (!id) {
    id = 'user_' + Math.random().toString(36).substring(2) + Date.now();
    localStorage.setItem('luminzenith_uid', id);
  }
  return id;
}

function getConversationsList() {
  const list = localStorage.getItem('luminzenith_convs');
  return list ? JSON.parse(list) : [];
}
function saveConversationsList(list) {
  localStorage.setItem('luminzenith_convs', JSON.stringify(list));
}
function creerNouvelleConversation() {
  const id = 'conv_' + Date.now();
  const list = getConversationsList();
  list.push({ id, titre: 'Nouvelle conversation' });
  saveConversationsList(list);
  localStorage.setItem('luminzenith_current_conv', id);
  return id;
}
function getCurrentConversationId() {
  let id = localStorage.getItem('luminzenith_current_conv');
  if (!id) id = creerNouvelleConversation();
  return id;
}

function StarField({ count = 60, shootingCount = 4, className = '' }) {
  const stars = useMemo(() => Array.from({ length: count }, () => ({
    top: Math.random() * 100, left: Math.random() * 100,
    dur: 1.2 + Math.random() * 2, driftDur: 3.5 + Math.random() * 4,
    delay: Math.random() * 3, size: Math.random() > 0.65 ? 4 : 2
  })), [count]);
  const shootingStars = useMemo(() => Array.from({ length: shootingCount }, () => ({
    top: Math.random() * 60, left: Math.random() * 70,
    delay: Math.random() * 6, dur: 3 + Math.random() * 2.5
  })), [shootingCount]);
  return (
    <div className={`absolute inset-0 overflow-hidden pointer-events-none ${className}`}>
      {stars.map((s, i) => (
        <div key={i} className="star absolute bg-[#f5e4d0] rounded-full"
          style={{ top: s.top + '%', left: s.left + '%', width: s.size, height: s.size,
            animationDelay: s.delay + 's', '--dur': s.dur + 's', '--driftDur': s.driftDur + 's',
            boxShadow: '0 0 6px 1px rgba(232,201,176,0.9)' }} />
      ))}
      {shootingStars.map((s, i) => (
        <div key={'shoot'+i} className="shooting-star absolute w-24 h-[2px]"
          style={{ top: s.top + '%', left: s.left + '%', animationDelay: s.delay + 's', animationDuration: s.dur + 's',
            background: 'linear-gradient(90deg, transparent, #f5e4d0, transparent)',
            boxShadow: '0 0 8px 2px rgba(232,201,176,0.6)' }} />
      ))}
    </div>
  );
}

function Splash({ onDone }) {
  const [fade, setFade] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setFade(true), 2200);
    const t2 = setTimeout(onDone, 3000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  return (
    <div className={`fixed inset-0 z-50 flex flex-col items-center justify-center transition-opacity duration-700 ${fade ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
      style={{ background: 'radial-gradient(circle at center, #140a06 0%, #000 60%, #000 100%)' }}>
      <StarField count={110} shootingCount={7} />
      <div className="flex flex-col items-center justify-center text-center z-10 px-4 w-full">
        <div className="relative w-[26rem] h-[26rem] sm:w-[30rem] sm:h-[30rem] flex items-center justify-center mb-4">
          <div className="glow-ring absolute inset-0 rounded-full blur-3xl"
            style={{ background: 'radial-gradient(circle, rgba(232,201,176,0.5), transparent 70%)' }} />
          <img src="LuminZenith AI.png" alt="LuminZenith AI"
            className="logo-fade relative w-full h-full object-contain"
            style={{ mixBlendMode: 'screen' }} />
        </div>
        <h1 className="font-display text-shine text-3xl sm:text-4xl font-bold mb-2 uppercase">LuminZenith AI</h1>
        <p className="text-[#8c5a3f] text-xs tracking-[4px] uppercase font-display">La lumière au sommet</p>
      </div>
    </div>
  );
}

function Sidebar({ onOpenConversations }) {
  const items = [
    { icon: '🏠', label: 'Accueil', active: true },
    { icon: '💬', label: 'Messages', onClick: onOpenConversations },
    { icon: '📞', label: 'Appels / Visio' },
    { icon: '📈', label: 'Activité' },
    { icon: '👤', label: 'Profil' },
  ];
  return (
    <div className="w-14 sm:w-56 shrink-0 flex flex-col py-6 border-r border-[#2a1a12]" style={{ background: '#050302' }}>
      <div className="flex items-center gap-3 px-2 sm:px-5 pb-5 mb-4 border-b border-[#2a1a12] justify-center sm:justify-start">
        <div className="relative w-9 h-9 shrink-0">
          <img src="LuminZenith AI.png" alt="logo" className="w-full h-full object-contain rounded-lg"
            style={{ mixBlendMode: 'screen', filter: 'drop-shadow(0 0 10px rgba(232,201,176,0.4))' }} />
        </div>
        <div className="hidden sm:block min-w-0">
          <div className="font-display text-[#e8c9b0] font-semibold text-sm leading-tight truncate">LuminZenith AI</div>
          <div className="text-[#6b4632] text-[9px] tracking-widest truncate font-display">LA LUMIÈRE AU SOMMET</div>
        </div>
      </div>
      {items.map((it, i) => (
        <div key={i} onClick={it.onClick}
          className={`flex items-center gap-3 px-2 sm:px-5 py-3 cursor-pointer text-sm border-l-2 justify-center sm:justify-start transition-colors
            ${it.active ? 'border-[#c98b72] text-[#e8c9b0] bg-[#c98b72]/10' : 'border-transparent text-stone-500 hover:text-[#e8c9b0] hover:bg-[#c98b72]/5'}`}>
          <span className="text-lg drop-shadow-[0_0_4px_rgba(201,139,114,0.5)] shrink-0">{it.icon}</span>
          <span className="hidden sm:inline truncate">{it.label}</span>
        </div>
      ))}
    </div>
  );
}

function ConversationsPanel({ open, onClose, current, onSelect }) {
  if (!open) return null;
  const list = getConversationsList().slice().reverse();
  return (
    <>
      <div onClick={onClose} className="fixed inset-0 bg-black/70 backdrop-blur-sm z-30" />
      <div className="fixed top-0 left-14 sm:left-56 w-64 max-w-[75vw] h-full z-40 p-4 border-r border-[#2a1a12] overflow-y-auto"
        style={{ background: '#080503' }}>
        <h3 className="font-display text-[#e8c9b0] text-lg mb-4">Conversations</h3>
        {list.length === 0 && <p className="text-stone-600 text-sm">Aucune conversation encore.</p>}
        {list.map(c => (
          <div key={c.id} onClick={() => onSelect(c.id)}
            className={`p-3 rounded-lg mb-2 cursor-pointer text-sm border transition-colors truncate
              ${c.id === current ? 'border-[#c98b72] text-[#e8c9b0] shadow-[0_0_12px_rgba(201,139,114,0.25)]' : 'border-[#2a1a12] text-stone-300 bg-black/40 hover:border-[#6b4632]'}`}>
            {c.titre}
          </div>
        ))}
      </div>
    </>
  );
}

function Hero() {
  return (
    <div className="relative flex flex-col items-center justify-center text-center py-12 px-4 border-b border-[#2a1a12]/60 overflow-hidden shrink-0">
      <StarField count={70} shootingCount={5} />
      <div className="relative w-80 h-80 sm:w-96 sm:h-96 flex items-center justify-center mb-3">
        <div className="glow-ring absolute inset-0 rounded-full blur-3xl"
          style={{ background: 'radial-gradient(circle, rgba(232,201,176,0.45), transparent 70%)' }} />
        <img src="LuminZenith AI.png" alt="LuminZenith AI"
          className="relative w-full h-full object-contain z-10"
          style={{ mixBlendMode: 'screen' }} />
      </div>
      <h2 className="font-display text-shine text-xl sm:text-2xl font-bold relative z-10 uppercase">LuminZenith AI</h2>
      <p className="text-[#6b4632] text-xs tracking-[3px] uppercase mt-1 relative z-10 font-display">La lumière au sommet</p>
    </div>
  );
}

const QUICK_ACTIONS = [
  { icon: '💰', label: 'Business', prompt: "Aide-moi sur le business et la stratégie : " },
  { icon: '📱', label: 'Réseaux sociaux', prompt: "Aide-moi sur les réseaux sociaux : " },
  { icon: '📊', label: 'Investissement', prompt: "Aide-moi sur l'investissement : " },
  { icon: '🎨', label: 'Création', prompt: "Aide-moi sur la création et le design : " },
  { icon: '⚡', label: 'Automatisation', prompt: "Aide-moi à automatiser : " },
];

function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [convOpen, setConvOpen] = useState(false);
  const [conversationId, setConversationId] = useState(getCurrentConversationId());
  const [messages, setMessages] = useState([
    { role: 'assistant', content: "Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?" }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const userId = useRef(getUserId()).current;
  const scrollRef = useRef(null);

  useEffect(() => { chargerHistorique(); }, [conversationId]);
  useEffect(() => { scrollRef.current?.scrollTo(0, scrollRef.current.scrollHeight); }, [messages, loading]);

  async function chargerHistorique() {
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [], userId, conversationId, chargerSeulement: true })
      });
      const data = await r.json();
      if (data.historique && data.historique.length > 0) {
        setMessages(data.historique);
      } else {
        setMessages([{ role: 'assistant', content: "Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?" }]);
      }
    } catch (e) { console.log('Pas d\'historique existant.'); }
  }

  function mettreAJourTitreConversation(premierMessage) {
    const list = getConversationsList();
    const conv = list.find(c => c.id === conversationId);
    if (conv && conv.titre === 'Nouvelle conversation') {
      conv.titre = premierMessage.substring(0, 30) + (premierMessage.length > 30 ? '...' : '');
      saveConversationsList(list);
    }
  }

  async function envoyer(texteOverride) {
    const texte = (texteOverride ?? input).trim();
    if (!texte) return;
    const nouvHist = [...messages, { role: 'user', content: texte }];
    setMessages(nouvHist);
    setInput('');
    mettreAJourTitreConversation(texte);
    setLoading(true);
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: nouvHist, userId, conversationId })
      });
      const rep = await r.text();
      setMessages(h => [...h, { role: 'assistant', content: rep }]);
    } catch (e) {
      setMessages(h => [...h, { role: 'assistant', content: 'Erreur de connexion.' }]);
    }
    setLoading(false);
  }

  function nouvelleConv() {
    const id = creerNouvelleConversation();
    setConversationId(id);
    setConvOpen(false);
  }
  function ouvrirConversation(id) {
    localStorage.setItem('luminzenith_current_conv', id);
    setConversationId(id);
    setConvOpen(false);
  }
  function formatMsg(text) {
    return text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  }

  return (
    <div className="flex h-screen w-full text-white overflow-hidden">
      {showSplash && <Splash onDone={() => setShowSplash(false)} />}
      <Sidebar onOpenConversations={() => setConvOpen(true)} />
      <ConversationsPanel open={convOpen} onClose={() => setConvOpen(false)} current={conversationId} onSelect={ouvrirConversation} />

      <div className="flex-1 flex flex-col min-w-0 overflow-hidden" style={{ background: 'radial-gradient(circle at 50% 0%,#0e0705 0%,#000 60%)' }}>
        <header className="relative flex items-center justify-center py-4 px-14 sm:px-16 border-b border-[#2a1a12] shadow-lg shrink-0"
          style={{ background: '#080503' }}>
          <button onClick={() => setConvOpen(true)}
            className="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 border border-[#6b4632] text-[#c98b72] text-[11px] sm:text-xs px-2 sm:px-3 py-2 rounded-lg hover:border-[#c98b72] transition-colors whitespace-nowrap">
            ☰ <span className="hidden sm:inline">Conversations</span>
          </button>
          <span className="font-display text-shine text-sm sm:text-xl font-bold truncate max-w-full uppercase">✦ LuminZenith AI</span>
          <button onClick={nouvelleConv}
            className="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 text-[11px] sm:text-xs font-semibold px-2 sm:px-3 py-2 rounded-lg text-[#1a0f0a] shadow-[0_0_14px_rgba(201,139,114,0.4)] hover:shadow-[0_0_22px_rgba(201,139,114,0.7)] transition-shadow whitespace-nowrap"
            style={{ background: 'linear-gradient(135deg,#e8c9b0,#8c5a3f)' }}>
            + <span className="hidden sm:inline">Nouvelle conversation</span>
          </button>
        </header>

        <div className="overflow-y-auto overflow-x-hidden flex-1 flex flex-col min-h-0">
          <Hero />

          <div className="flex gap-3 overflow-x-auto overflow-y-hidden px-5 py-4 border-b border-[#2a1a12]/50 shrink-0">
            {QUICK_ACTIONS.map((qa, i) => (
              <div key={i} onClick={() => setInput(qa.prompt)}
                className="min-w-[110px] shrink-0 text-center rounded-xl border border-[#3a2418] px-3 py-4 cursor-pointer text-[#c98b72] text-xs hover:border-[#c98b72] hover:shadow-[0_0_18px_rgba(201,139,114,0.3)] hover:-translate-y-0.5 transition-all"
                style={{ background: '#0f0906' }}>
                <div className="text-2xl mb-2 drop-shadow-[0_0_6px_rgba(201,139,114,0.5)]">{qa.icon}</div>
                {qa.label}
              </div>
            ))}
          </div>

          <div ref={scrollRef} className="flex-1 px-5 sm:px-10 py-5 flex flex-col gap-3 min-w-0 max-w-5xl mx-auto w-full">
            {messages.map((m, i) => (
              <div key={i}
                className={`max-w-[600px] w-fit px-4 py-3 rounded-2xl text-sm leading-relaxed break-words
                  ${m.role === 'user'
                    ? 'self-end bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700'
                    : 'self-start border border-[#3a2418] text-[#e0c4ac]'}`}
                style={m.role === 'assistant' ? { background: '#0f0906' } : {}}
                dangerouslySetInnerHTML={{ __html: formatMsg(m.content) }} />
            ))}
            {loading && <div className="self-start text-[#8c5a3f] italic text-sm px-4">LuminZenith réfléchit...</div>}
          </div>
        </div>

        <div className="flex gap-3 p-4 border-t border-[#2a1a12] shrink-0" style={{ background: '#050302' }}>
          <input value={input} onChange={e => setInput(e.target.value)}
            onKeyPress={e => e.key === 'Enter' && envoyer()}
            placeholder="Écrivez votre message..."
            className="flex-1 min-w-0 bg-[#0f0906] border border-[#3a2418] rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-[#c98b72] focus:shadow-[0_0_14px_rgba(201,139,114,0.25)]" />
          <button onClick={() => envoyer()}
            className="shrink-0 px-4 sm:px-6 py-3 rounded-lg font-semibold text-[#1a0f0a] text-sm shadow-[0_0_16px_rgba(201,139,114,0.4)] hover:shadow-[0_0_26px_rgba(201,139,114,0.7)] hover:-translate-y-0.5 transition-all"
            style={{ background: 'linear-gradient(135deg,#e8c9b0,#8c5a3f)' }}>
            Envoyer
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
