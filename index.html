<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://cdn.tailwindcss.com"></script>
<script
  data-memberstack-app="app_cmrsf4mt3002q0svtg4bt4p4a"
  src="https://static.memberstack.com/scripts/v2/memberstack.js"
  type="text/javascript"
></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{overflow-x:hidden!important;width:100%!important;max-width:100%!important;}
body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;overflow-x:hidden!important;font-family:'Source Serif 4',serif;background:#000;}
*{box-sizing:border-box;min-width:0;}
#root{width:100%;max-width:100%;overflow-x:hidden;}
.font-display{font-family:'Libre Bodoni',serif;letter-spacing:0.5px;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#40301f;border-radius:10px;}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(0.6)}50%{opacity:1;transform:scale(1.6)}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-20px)}}
.star{animation:twinkle var(--dur,2.5s) ease-in-out infinite, drift var(--driftDur,7s) ease-in-out infinite alternate;}
@keyframes shoot{0%{transform:translate(0,0) rotate(-35deg);opacity:0}5%{opacity:1}55%{opacity:.9}85%{opacity:.25}100%{transform:translate(560px,392px) rotate(-35deg);opacity:0}}
.shooting-star{animation:shoot cubic-bezier(.25,.46,.45,.94) infinite;position:absolute;}
.shooting-star::after{content:'';position:absolute;right:-1px;top:50%;width:3px;height:3px;background:#e8d4ab;border-radius:50%;transform:translateY(-50%);box-shadow:0 0 10px 3px rgba(232,212,171,0.95);}
@keyframes shine{to{background-position:200% center;}}
.text-shine{background:linear-gradient(90deg,#33221a,#b8905f,#dcc396,#b8905f,#33221a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;}
@keyframes pulseglow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
.glow-ring{animation:pulseglow 3.5s ease-in-out infinite;}
.logo-fade{
  -webkit-mask-image:radial-gradient(circle, black 45%, transparent 78%);
  mask-image:radial-gradient(circle, black 45%, transparent 78%);
}
.btn-gold-outline{
  color:#ffffff;font-weight:600;transition:all .2s;border:1.5px solid #8f5f3d;
  background:linear-gradient(145deg,#020102 0%,#1a130f 45%,#3d2818 75%,#1a130f 100%);
  box-shadow:0 0 10px rgba(143,95,61,0.2), inset 0 1px 0 rgba(220,195,150,0.15);
}
.btn-gold-outline:hover{border-color:#dcc396;box-shadow:0 0 18px rgba(143,95,61,0.5), inset 0 1px 0 rgba(220,195,150,0.25);}
.btn-text-shine{background:linear-gradient(90deg,#8a8a8a,#ffffff,#fff8e8,#ffffff,#8a8a8a);background-size:180% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.5s linear infinite;}
@keyframes shineStar{0%,100%{opacity:.4;transform:scale(0.8) rotate(0deg);text-shadow:0 0 4px rgba(184,144,95,0.4);}50%{opacity:1;transform:scale(1.3) rotate(20deg);text-shadow:0 0 12px rgba(220,195,150,0.9);}}
.shining-star{display:inline-block;animation:shineStar 1.1s ease-in-out infinite;}
</style>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const WORKER = 'https://luminzenithai-api.luminzenithai.workers.dev';
let memberIdActuel = null;

function heureActuelle() {
  return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function getAnonymousId() {
  let id = localStorage.getItem('luminzenith_uid');
  if (!id) {
    id = 'user_' + Math.random().toString(36).substring(2) + Date.now();
    localStorage.setItem('luminzenith_uid', id);
  }
  return id;
}

function getConversationsList() {
  const list = localStorage.getItem('luminzenith_convs');
  return list ? JSON.parse(list) : [];
}
function saveConversationsList(list) {
  localStorage.setItem('luminzenith_convs', JSON.stringify(list));
  if (memberIdActuel) {
    fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'sauverListe', userId: memberIdActuel, liste: list })
    }).catch(() => {});
  }
}
async function chargerListeServeur(userId) {
  try {
    const r = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'chargerListe', userId })
    });
    const data = await r.json();
    return data.liste || [];
  } catch (e) {
    return [];
  }
}
function renommerConversation(id) {
  const list = getConversationsList();
  const conv = list.find(c => c.id === id);
  const nouveauNom = window.prompt('Renommer la conversation :', conv ? conv.titre : '');
  if (!nouveauNom || !nouveauNom.trim()) return;
  if (conv) { conv.titre = nouveauNom.trim(); saveConversationsList(list); }
}
function toggleFavoriConversation(id) {
  const list = getConversationsList();
  const conv = list.find(c => c.id === id);
  if (conv) { conv.favori = !conv.favori; saveConversationsList(list); }
}
function supprimerConversation(id) {
  if (!window.confirm('Supprimer définitivement cette conversation ?')) return;
  const list = getConversationsList().filter(c => c.id !== id);
  saveConversationsList(list);
}
function toggleArchiveConversation(id) {
  const list = getConversationsList();
  const conv = list.find(c => c.id === id);
  if (conv) { conv.archive = !conv.archive; saveConversationsList(list); }
}
function partagerConversation(id, titre) {
  const url = window.location.origin + window.location.pathname + '?conv=' + encodeURIComponent(id);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => {
      alert('Lien copié : "' + titre + '"\n\nCe lien rouvre cette conversation précise sur ton compte.');
    }).catch(() => {
      window.prompt('Copie ce lien :', url);
    });
  } else {
    window.prompt('Copie ce lien :', url);
  }
}
function creerNouvelleConversation() {
  const id = 'conv_' + Date.now();
  const list = getConversationsList();
  list.push({ id, titre: 'Nouvelle conversation' });
  saveConversationsList(list);
  localStorage.setItem('luminzenith_current_conv', id);
  return id;
}
function getCurrentConversationId() {
  const params = new URLSearchParams(window.location.search);
  const partage = params.get('conv');
  if (partage) {
    localStorage.setItem('luminzenith_current_conv', partage);
    return partage;
  }
  let id = localStorage.getItem('luminzenith_current_conv');
  if (!id) id = creerNouvelleConversation();
  return id;
}

function StarField({ count = 90, shootingCount = 6, className = '' }) {
  const stars = useMemo(() => Array.from({ length: count }, () => ({
    top: Math.random() * 100, left: Math.random() * 100,
    dur: 1.2 + Math.random() * 2, driftDur: 3.5 + Math.random() * 4,
    delay: Math.random() * 3, size: Math.random() > 0.65 ? 3 : 1.5,
    warm: Math.random() > 0.5
  })), [count]);
  const shootingStars = useMemo(() => Array.from({ length: shootingCount }, () => ({
    top: Math.random() * 60, left: Math.random() * 70,
    delay: Math.random() * 6, dur: 3 + Math.random() * 2.5
  })), [shootingCount]);
  return (
    <div className={`absolute inset-0 overflow-hidden pointer-events-none ${className}`}>
      {stars.map((s, i) => (
        <div key={i} className="star absolute rounded-full"
          style={{ top: s.top + '%', left: s.left + '%', width: s.size, height: s.size,
            background: s.warm ? '#dcc396' : '#ffffff',
            animationDelay: s.delay + 's', '--dur': s.dur + 's', '--driftDur': s.driftDur + 's',
            boxShadow: s.warm ? '0 0 3px 0.5px rgba(184,144,95,0.9)' : '0 0 3px 0.5px rgba(255,255,255,0.9)' }} />
      ))}
      {shootingStars.map((s, i) => (
        <div key={'shoot'+i} className="shooting-star w-32 h-[1.5px]"
          style={{ top: s.top + '%', left: s.left + '%', animationDelay: s.delay + 's', animationDuration: s.dur + 's',
            background: 'linear-gradient(90deg, transparent, #dcc396, #e8d4ab)',
            boxShadow: '0 0 6px 1px rgba(184,144,95,0.5)' }} />
      ))}
    </div>
  );
}

function Splash({ onDone }) {
  const [fade, setFade] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setFade(true), 2200);
    const t2 = setTimeout(onDone, 3000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  return (
    <div className={`fixed inset-0 z-50 flex flex-col items-center justify-center transition-opacity duration-700 ${fade ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
      style={{ background: 'radial-gradient(circle at center, #0b0805 0%, #000 60%, #000 100%)' }}>
      <StarField count={160} shootingCount={10} />
      <div className="flex flex-col items-center justify-center text-center z-10 px-4 w-full">
        <div className="relative w-[26rem] h-[26rem] sm:w-[30rem] sm:h-[30rem] flex items-center justify-center mb-4">
          <div className="glow-ring absolute inset-0 rounded-full blur-3xl"
            style={{ background: 'radial-gradient(circle, rgba(184,144,95,0.5), transparent 70%)' }} />
          <img src="LuminZenith AI.png" alt="LuminZenith AI"
            className="logo-fade relative w-full h-full object-contain"
            style={{ mixBlendMode: 'screen' }} />
        </div>
        <h1 className="font-display text-shine text-3xl sm:text-4xl font-bold mb-2 uppercase">LuminZenith AI</h1>
        <p className="text-[#6e4a35] text-xs tracking-[4px] uppercase font-display">La lumière au sommet</p>
      </div>
    </div>
  );
}

function AuthModal({ open, onClose, onAuthSuccess }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  if (!open) return null;

  async function submit() {
    setError('');
    if (!email || !password) { setError('Remplis tous les champs.'); return; }
    setLoading(true);
    try {
      const ms = window.$memberstackDom;
      if (!ms) { setError("Le service d'authentification n'est pas encore prêt. Réessaie dans un instant."); setLoading(false); return; }
      let res;
      if (mode === 'signup') {
        res = await ms.signupMemberEmailPassword({ email, password });
      } else {
        res = await ms.loginMemberEmailPassword({ email, password });
      }
      if (res && res.data) {
        onAuthSuccess(res.data.member || res.data);
        onClose();
      }
    } catch (e) {
      setError(e.message || "Une erreur s'est produite. Vérifie tes identifiants.");
    }
    setLoading(false);
  }

  return (
    <>
      <div onClick={onClose} className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50" />
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div className="relative w-full max-w-md rounded-2xl border border-[#16110c] p-8"
          style={{ background: 'linear-gradient(160deg,#0b0805,#020102)' }}>
          <button onClick={onClose} className="absolute top-4 right-4 text-white/70 hover:text-white text-xl">✕</button>

          <div className="text-center mb-6">
            <div className="w-14 h-14 mx-auto mb-3">
              <img src="LuminZenith AI.png" alt="logo" className="w-full h-full object-contain" style={{ mixBlendMode: 'screen' }} />
            </div>
            <h2 className="font-display text-2xl text-white uppercase">
              {mode === 'login' ? 'Connexion' : 'Créer un compte'}
            </h2>
          </div>

          <div className="flex mb-6 rounded-lg overflow-hidden border border-[#16110c]">
            <button onClick={() => setMode('login')}
              className={`flex-1 py-2 text-sm font-display ${mode === 'login' ? 'text-[#150f0a]' : 'text-[#6e4a35]'}`}
              style={mode === 'login' ? { background: 'linear-gradient(135deg,#dcc396,#b8905f,#8f6a45,#6e4a35)' } : { background: '#0c0a07' }}>
              Se connecter
            </button>
            <button onClick={() => setMode('signup')}
              className={`flex-1 py-2 text-sm font-display ${mode === 'signup' ? 'text-[#150f0a]' : 'text-[#6e4a35]'}`}
              style={mode === 'signup' ? { background: 'linear-gradient(135deg,#dcc396,#b8905f,#8f6a45,#6e4a35)' } : { background: '#0c0a07' }}>
              S'inscrire
            </button>
          </div>

          <div className="flex flex-col gap-3">
            <input type="email" placeholder="Adresse email" value={email} onChange={e => setEmail(e.target.value)}
              className="bg-[#0c0a07] border border-[#16110c] rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-[#8f5f3d]" />
            <input type="password" placeholder="Mot de passe" value={password} onChange={e => setPassword(e.target.value)}
              onKeyPress={e => e.key === 'Enter' && submit()}
              className="bg-[#0c0a07] border border-[#16110c] rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-[#8f5f3d]" />

            {error && <p className="text-red-400 text-xs">{error}</p>}

            <button onClick={submit} disabled={loading}
              className="btn-gold-outline mt-2 py-3 rounded-lg font-semibold text-sm transition-all disabled:opacity-50">
              <span className="btn-text-shine">{loading ? 'Un instant...' : (mode === 'login' ? 'Se connecter' : "Créer mon compte")}</span>
            </button>
          </div>

          <p className="text-center text-white/70 text-xs mt-5">
            {mode === 'login' ? "Pas encore de compte ?" : "Déjà un compte ?"}{' '}
            <button onClick={() => setMode(mode === 'login' ? 'signup' : 'login')} className="text-white underline">
              {mode === 'login' ? "S'inscrire" : "Se connecter"}
            </button>
          </p>
        </div>
      </div>
    </>
  );
}

function Sidebar({ onOpenConversations, onOpenProfil, onOpenPaywall, member, forfait, onOpenAuth, onLogout }) {
  const icons = {
    home: <path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />,
    chat: <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z" />,
    call: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />,
    activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />,
    profile: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>,
  };
  const items = [
    { key: 'home', label: 'Accueil', active: true },
    { key: 'chat', label: 'Messages', onClick: onOpenConversations },
    { key: 'call', label: 'Appels / Visio' },
    { key: 'activity', label: 'Activité' },
    { key: 'profile', label: 'Profil', onClick: onOpenProfil },
  ];
  return (
    <div className="w-16 sm:w-64 shrink-0 flex flex-col py-6 border-r border-[#140f0b]" style={{ background: '#020102' }}>
      <div className="flex items-center gap-3 px-3 sm:px-5 pb-5 mb-4 border-b border-[#140f0b] justify-center sm:justify-start">
        <div className="w-11 h-11 shrink-0 rounded-xl border border-[#16110c] flex items-center justify-center" style={{ background: '#0c0a07' }}>
          <img src="LuminZenith AI.png" alt="logo" className="w-8 h-8 object-contain" />
        </div>
        <div className="hidden sm:block min-w-0">
          <div className="font-display text-[#b8905f] font-semibold text-sm leading-tight truncate">LuminZenith AI</div>
          <div className="text-white/70 text-[9px] tracking-widest truncate font-display">LA LUMIÈRE AU SOMMET</div>
        </div>
      </div>
      {items.map((it, i) => (
        <div key={i} onClick={it.onClick}
          className={`flex items-center gap-3 px-3 sm:px-5 py-3 cursor-pointer text-sm border-l-2 justify-center sm:justify-start transition-colors
            ${it.active ? 'border-[#8f5f3d] text-white bg-[#8f5f3d]/10' : 'border-transparent text-stone-500 hover:text-white hover:bg-[#8f5f3d]/5'}`}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0 drop-shadow-[0_0_4px_rgba(143,95,61,0.4)]">
            {icons[it.key]}
          </svg>
          <span className="hidden sm:inline truncate">{it.label}</span>
        </div>
      ))}

      <div className="hidden sm:block mt-6 mx-5 p-4 rounded-xl border border-[#16110c]" style={{ background: '#0c0a07' }}>
        <div className="text-white text-sm font-display mb-1">Ton potentiel</div>
        <div className="text-white/80 text-xs leading-relaxed mb-3">Découvre ce que LuminZenith peut débloquer pour toi avec un forfait supérieur.</div>
        <button onClick={onOpenPaywall} className="btn-gold-outline w-full py-2 rounded-lg text-xs font-semibold">
          <span className="btn-text-shine">Voir plus</span>
        </button>
      </div>

      <div className="mt-4 sm:mt-6 px-3 sm:px-5">
        {member ? (
          <div className="hidden sm:flex flex-col gap-2 p-4 rounded-xl border border-[#16110c]" style={{ background: '#0c0a07' }}>
            <span className="inline-block w-fit text-[10px] tracking-wide px-2 py-0.5 rounded-full border border-[#8f5f3d] text-[#8f5f3d] uppercase">{forfait || 'aube'}</span>
            <div className="text-white text-xs truncate">{member.auth?.email || member.email}</div>
            <button onClick={onOpenPaywall} className="text-[11px] text-[#b8905f] hover:text-white text-left mt-1">
              Centre Premium →
            </button>
            <button onClick={onLogout} className="text-[11px] text-white/70 hover:text-white text-left">
              Déconnexion
            </button>
          </div>
        ) : (
          <button onClick={onOpenAuth}
            className="btn-gold-outline w-full py-2 rounded-lg text-[11px] sm:text-xs font-semibold">
            <span className="btn-text-shine">Se connecter</span>
          </button>
        )}
      </div>
    </div>
  );
}


function ConversationsPanel({ open, onClose, current, onSelect }) {
  const [menuOpenId, setMenuOpenId] = useState(null);
  const [showArchived, setShowArchived] = useState(false);
  if (!open) return null;
  const all = getConversationsList().slice().reverse();
  const archivedCount = all.filter(c => c.archive).length;
  const base = showArchived ? all.filter(c => c.archive) : all.filter(c => !c.archive);
  const list = [...base.filter(c => c.favori), ...base.filter(c => !c.favori)];

  function handleAction(action, id) {
    setMenuOpenId(null);
    if (action === 'renommer') renommerConversation(id);
    if (action === 'favori') toggleFavoriConversation(id);
    if (action === 'archiver') toggleArchiveConversation(id);
    if (action === 'partager') {
      const conv = getConversationsList().find(c => c.id === id);
      partagerConversation(id, conv ? conv.titre : '');
    }
    if (action === 'supprimer') {
      supprimerConversation(id);
      if (id === current) {
        const nouvelId = creerNouvelleConversation();
        onSelect(nouvelId);
      }
    }
  }

  return (
    <>
      <div onClick={() => { onClose(); setMenuOpenId(null); }} className="fixed inset-0 bg-black/70 backdrop-blur-sm z-30" />
      <div className="fixed top-0 left-16 sm:left-64 w-64 max-w-[75vw] h-full z-40 p-4 border-r border-[#140f0b] overflow-y-auto"
        style={{ background: '#040302' }}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-display text-white text-lg">{showArchived ? 'Archivées' : 'Conversations'}</h3>
          {archivedCount > 0 && (
            <button onClick={() => setShowArchived(!showArchived)} className="text-[10px] text-white/70 hover:text-white underline">
              {showArchived ? 'Retour' : `Archives (${archivedCount})`}
            </button>
          )}
        </div>
        {list.length === 0 && <p className="text-stone-600 text-sm">{showArchived ? 'Aucune conversation archivée.' : 'Aucune conversation encore.'}</p>}
        {list.map(c => (
          <div key={c.id} className="relative mb-2">
            <div onClick={() => { onSelect(c.id); setMenuOpenId(null); }}
              className={`p-3 pr-9 rounded-lg cursor-pointer text-sm border transition-colors truncate flex items-center gap-1
                ${c.id === current ? 'border-[#8f5f3d] text-white shadow-[0_0_12px_rgba(143,95,61,0.25)]' : 'border-[#140f0b] text-stone-300 bg-black/40 hover:border-[#5f4a35]'}`}>
              {c.favori && <span className="text-[#8f5f3d] shrink-0">★</span>}
              <span className="truncate">{c.titre}</span>
            </div>
            <button onClick={(e) => { e.stopPropagation(); setMenuOpenId(menuOpenId === c.id ? null : c.id); }}
              className="absolute top-2 right-1.5 w-6 h-6 rounded-md flex items-center justify-center text-[#5f4a35] hover:text-[#b8905f] hover:bg-[#8f5f3d]/10">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="19" cy="12" r="2" /></svg>
            </button>
            {menuOpenId === c.id && (
              <div onClick={(e) => e.stopPropagation()}
                className="absolute right-0 top-9 z-50 w-44 rounded-lg border border-[#16110c] overflow-hidden shadow-lg"
                style={{ background: '#0c0a07' }}>

function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [convOpen, setConvOpen] = useState(false);
  const [profilOpen, setProfilOpen] = useState(false);
  const [authOpen, setAuthOpen] = useState(false);
  const [member, setMember] = useState(null);
  const [conversationId, setConversationId] = useState(getCurrentConversationId());
  const [messages, setMessages] = useState([
    { role: 'assistant', content: "Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?", heure: heureActuelle() }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [attachedFile, setAttachedFile] = useState(null);
  const [listening, setListening] = useState(false);
  const [cameraOpen, setCameraOpen] = useState(false);
  const [forfait, setForfait] = useState('aube');
  const [quotaInfo, setQuotaInfo] = useState(null);
  const [paywallOpen, setPaywallOpen] = useState(false);
  const [blocageActif, setBlocageActif] = useState(false);
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const anonymousIdRef = useRef(getAnonymousId());
  const userId = member?.id || anonymousIdRef.current;
  const email = member?.auth?.email || member?.email || null;
  const scrollRef = useRef(null);
  const textareaRef = useRef(null);
  const fileInputRef = useRef(null);
  const recognitionRef = useRef(null);

  async function rafraichirForfait() {
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'obtenirForfait', userId })
      });
      const d = await r.json();
      setForfait(d.plan || 'aube');
      if (d.quota && d.details) setQuotaInfo({ ...d.quota, cap: d.details.cap });
    } catch (e) {}
  }

  useEffect(() => { rafraichirForfait(); }, [userId]);

  async function lancerCheckout(cle) {
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'creerCheckout', userId, plan: cle, email })
      });
      const data = await r.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        alert(data.error || "Impossible de démarrer le paiement.");
      }
    } catch (e) {
      alert("Erreur de connexion au service de paiement.");
    }
  }

  async function initialiserStripe() {
    if (!window.confirm("Créer les 3 produits payants sur Stripe maintenant ? À ne faire qu'une seule fois.")) return;
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'initialiserStripe' })
      });
      const data = await r.json();
      alert(data.ok ? "Produits Stripe créés avec succès." : (data.error || "Erreur."));
    } catch (e) {
      alert("Erreur de connexion.");
    }
  }

  function handleInputChange(e) {
    setInput(e.target.value);
    const el = e.target;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 240) + 'px';
  }

  function handleFileSelect(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const isVideo = file.type.startsWith('video/');
    const reader = new FileReader();
    reader.onload = () => {
      setAttachedFile({ dataUrl: reader.result, type: isVideo ? 'video' : 'image', name: file.name });
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function removeAttachment() {
    setAttachedFile(null);
  }

  async function openCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      streamRef.current = stream;
      setCameraOpen(true);
      setTimeout(() => {
        if (videoRef.current) videoRef.current.srcObject = stream;
      }, 0);
    } catch (e) {
      alert("Impossible d'accéder à la caméra. Vérifie que l'accès est autorisé pour ce site.");
    }
  }

  function closeCamera() {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach(t => t.stop());
      streamRef.current = null;
    }
    setCameraOpen(false);
  }

  function capturePhoto() {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/png');
    setAttachedFile({ dataUrl, type: 'image', name: 'photo.png' });
    closeCamera();
  }

  function toggleMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("La dictée vocale n'est pas prise en charge par ce navigateur.");
      return;
    }
    if (listening) {
      recognitionRef.current && recognitionRef.current.stop();
      setListening(false);
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = (event) => {
      let texteRecu = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        texteRecu += event.results[i][0].transcript;
      }
      setInput(prev => {
        const nouveau = (prev ? prev + ' ' : '') + texteRecu;
        setTimeout(() => {
          if (textareaRef.current) {
            textareaRef.current.style.height = 'auto';
            textareaRef.current.style.height = Math.min(textareaRef.current.scrollHeight, 240) + 'px';
          }
        }, 0);
        return nouveau;
      });
    };
    recognition.onend = () => setListening(false);
    recognition.onerror = (event) => {
      setListening(false);
      const messages = {
        'not-allowed': "L'accès au micro a été refusé. Autorise le micro pour ce site dans les réglages du navigateur.",
        'audio-capture': "Aucun micro détecté sur cet appareil.",
        'network': "Le service de reconnaissance vocale n'a pas pu être joint (connexion réseau).",
        'service-not-allowed': "Le service de dictée vocale est désactivé ou bloqué sur cet appareil."
      };
      alert(messages[event.error] || ("Erreur du micro : " + event.error));
    };
    recognitionRef.current = recognition;
    try {
      recognition.start();
      setListening(true);
    } catch (e) {
      alert("Impossible de démarrer le micro : " + e.message);
      setListening(false);
    }
  }

  useEffect(() => {
    const checkMember = async () => {
      try {
        if (window.$memberstackDom) {
          const res = await window.$memberstackDom.getCurrentMember();
          if (res && res.data) setMember(res.data);
        }
      } catch (e) {}
    };
    setTimeout(checkMember, 800);
  }, []);

  useEffect(() => { chargerHistorique(); }, [conversationId, userId]);

  useEffect(() => {
    memberIdActuel = member?.id || null;
    if (!member?.id) return;
    chargerListeServeur(member.id).then(listeServeur => {
      const listeLocale = getConversationsList();
      const idsServeur = new Set(listeServeur.map(c => c.id));
      const fusion = [...listeServeur, ...listeLocale.filter(c => !idsServeur.has(c.id))];
      saveConversationsList(fusion);
    });
  }, [member]);
  useEffect(() => { scrollRef.current?.scrollTo(0, scrollRef.current.scrollHeight); }, [messages, loading]);

  async function chargerHistorique() {
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [], userId, conversationId, chargerSeulement: true })
      });
      const data = await r.json();
      if (data.historique && data.historique.length > 0) {
        setMessages(data.historique);
      } else {
        setMessages([{ role: 'assistant', content: "Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?", heure: heureActuelle() }]);
      }
    } catch (e) { console.log('Pas d\'historique existant.'); }
  }

  function mettreAJourTitreConversation(premierMessage) {
    const list = getConversationsList();
    const conv = list.find(c => c.id === conversationId);
    if (conv && conv.titre === 'Nouvelle conversation') {
      conv.titre = premierMessage.substring(0, 30) + (premierMessage.length > 30 ? '...' : '');
      saveConversationsList(list);
    }
  }

  async function envoyer(texteOverride) {
    const texte = (texteOverride ?? input).trim();
    if (!texte && !attachedFile) return;
    const fichierEnvoye = attachedFile;
    const nouvMessage = { role: 'user', content: texte, attachment: fichierEnvoye, heure: heureActuelle() };
    const nouvHist = [...messages, nouvMessage];
    setMessages(nouvHist);
    setInput('');
    setAttachedFile(null);
    if (textareaRef.current) textareaRef.current.style.height = 'auto';
    mettreAJourTitreConversation(texte || (fichierEnvoye ? fichierEnvoye.name : 'Pièce jointe'));
    setLoading(true);
    const messagesPourAPI = nouvHist.map(m => ({
      role: m.role,
      content: m.content && m.content.trim() ? m.content : (m.attachment ? '(pièce jointe envoyée)' : '')
    })).filter(m => m.content);
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messagesPourAPI, userId, conversationId, image: fichierEnvoye ? fichierEnvoye.dataUrl : undefined })
      });
      const rep = await r.text();
      if (rep === '__QUOTA_LIMIT__') {
        setBlocageActif(true);
        setPaywallOpen(true);
      } else {
        setMessages(h => [...h, { role: 'assistant', content: rep, heure: heureActuelle() }]);
      }
      rafraichirForfait();
    } catch (e) {
      setMessages(h => [...h, { role: 'assistant', content: 'Erreur de connexion.', heure: heureActuelle() }]);
    }
    setLoading(false);
  }

  function nouvelleConv() {
    const id = creerNouvelleConversation();
    setConversationId(id);
    setConvOpen(false);
  }
  function ouvrirConversation(id) {
    localStorage.setItem('luminzenith_current_conv', id);
    setConversationId(id);
    setConvOpen(false);
  }
  function formatMsg(text) {
    return text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  }

  async function handleLogout() {
    try {
      if (window.$memberstackDom) await window.$memberstackDom.logout();
    } catch (e) {}
    setMember(null);
  }

  return (
    <div className="flex h-screen w-full text-white overflow-hidden">
      {showSplash && <Splash onDone={() => setShowSplash(false)} />}
      <AuthModal open={authOpen} onClose={() => setAuthOpen(false)} onAuthSuccess={setMember} />
      {cameraOpen && (
        <>
          <div onClick={closeCamera} className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50" />
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div className="relative w-full max-w-lg rounded-2xl border border-[#16110c] p-5 flex flex-col items-center gap-4"
              style={{ background: 'linear-gradient(160deg,#0b0805,#020102)' }}>
              <button onClick={closeCamera} className="absolute top-3 right-3 text-white/70 hover:text-white text-xl">✕</button>
              <video ref={videoRef} autoPlay playsInline className="w-full rounded-lg bg-black" />
              <canvas ref={canvasRef} className="hidden" />
              <button onClick={capturePhoto}
                className="btn-gold-outline px-6 py-3 rounded-lg font-semibold text-sm transition-all">
                <span className="btn-text-shine">Capturer</span>
              </button>
            </div>
          </div>
        </>
      )}
      <Sidebar onOpenConversations={() => setConvOpen(true)} onOpenProfil={() => setProfilOpen(true)} onOpenPaywall={() => { setBlocageActif(false); setPaywallOpen(true); }} member={member} forfait={forfait} onOpenAuth={() => setAuthOpen(true)} onLogout={handleLogout} />
      <ConversationsPanel open={convOpen} onClose={() => setConvOpen(false)} current={conversationId} onSelect={ouvrirConversation} />
      <ProfilPanel open={profilOpen} onClose={() => setProfilOpen(false)} member={member} forfait={forfait} quota={quotaInfo}
        onOpenPaywall={() => { setBlocageActif(false); setPaywallOpen(true); }} onOpenAuth={() => setAuthOpen(true)} onLogout={handleLogout} />
      <PaywallPanel open={paywallOpen} onClose={() => { setPaywallOpen(false); setBlocageActif(false); }} userId={userId} email={email}
        forfaitActuel={forfait} onLancerCheckout={lancerCheckout} onInitialiserStripe={initialiserStripe} bloquant={blocageActif} />

      <div className="flex-1 flex flex-col min-w-0 overflow-hidden" style={{ background: 'radial-gradient(circle at 50% 0%,#080604 0%,#000 60%)' }}>
        <header className="relative flex items-center justify-center py-4 px-14 sm:px-16 border-b border-[#140f0b] shadow-lg shrink-0"
          style={{ background: '#040302' }}>
          <button onClick={() => setConvOpen(true)}
            className="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 border border-[#5f4a35] text-white text-[11px] sm:text-xs px-2 sm:px-3 py-2 rounded-lg hover:border-[#8f5f3d] transition-colors whitespace-nowrap">
            ☰ <span className="hidden sm:inline">Conversations</span>
          </button>
          <span className="font-display text-shine text-sm sm:text-xl font-bold truncate max-w-full uppercase">✦ LuminZenith AI</span>
          <div className="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 flex items-center gap-2">
            <button onClick={nouvelleConv}
              className="btn-gold-outline text-[11px] sm:text-xs font-semibold px-2 sm:px-3 py-2 rounded-lg whitespace-nowrap">
              <span className="btn-text-shine">+ <span className="hidden sm:inline">Nouvelle conversation</span></span>
            </button>
          </div>
        </header>

        <div className="overflow-y-auto overflow-x-hidden flex-1 flex flex-col min-h-0">
          <Hero />

          <div className="flex gap-3 overflow-x-auto overflow-y-hidden px-5 py-4 border-b border-[#140f0b]/50 shrink-0">
            {QUICK_ACTIONS.map((qa, i) => (
              <div key={i} onClick={() => setInput(qa.prompt)}
                className="min-w-[130px] shrink-0 flex flex-col items-center gap-2 text-center rounded-xl border border-[#16110c] px-3 py-4 cursor-pointer text-white text-xs hover:border-[#8f5f3d] hover:shadow-[0_0_18px_rgba(143,95,61,0.3)] hover:-translate-y-0.5 transition-all"
                style={{ background: '#0c0a07' }}>
                <div className="w-10 h-10 rounded-lg border border-[#16110c] flex items-center justify-center">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8f5f3d" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    {QUICK_ACTION_ICONS[qa.key]}
                  </svg>
                </div>
                <span className="leading-tight">{qa.label}</span>
              </div>
            ))}
          </div>

          <div ref={scrollRef} className="flex-1 px-5 sm:px-10 py-5 flex flex-col gap-4 min-w-0 max-w-7xl mx-auto w-full">
            {messages.map((m, i) => (
              <div key={i} className={`flex items-end gap-2 ${m.role === 'user' ? 'self-end flex-row-reverse' : 'self-start'}`}>
                <div className={`w-8 h-8 shrink-0 rounded-lg border flex items-center justify-center overflow-hidden ${m.role === 'user' ? 'border-[#8f5f3d]' : 'border-[#16110c]'}`}
                  style={m.role === 'assistant' ? { background: '#0c0a07' } : { background: 'linear-gradient(135deg,#dcc396,#b8905f,#8f6a45,#6e4a35)' }}>
                  {m.role === 'assistant'
                    ? <img src="LuminZenith AI.png" alt="LZ" className="w-6 h-6 object-contain" />
                    : (m.attachment && m.attachment.type === 'image'
                        ? <img src={m.attachment.dataUrl} alt="" className="w-full h-full object-cover" />
                        : <span className="text-[#150f0a] text-xs font-semibold">{(email || 'U')[0].toUpperCase()}</span>)}
                </div>
                <div className={`max-w-[720px] w-fit px-4 py-3 rounded-2xl text-sm leading-relaxed break-words flex flex-col gap-2
                    ${m.role === 'user'
                      ? 'border border-[#8f5f3d]/40'
                      : 'border border-[#16110c] text-white'}`}
                  style={{ background: '#0c0a07' }}>
                  {m.role === 'assistant' && <span className="text-[#8f5f3d] text-xs font-semibold">LuminZenith AI</span>}
                  {m.attachment && m.attachment.type === 'image' && (
                    <img src={m.attachment.dataUrl} alt={m.attachment.name} className="max-w-[260px] max-h-[260px] rounded-lg object-contain" />
                  )}
                  {m.attachment && m.attachment.type === 'video' && (
                    <video src={m.attachment.dataUrl} controls className="max-w-[260px] max-h-[260px] rounded-lg" />
                  )}
                  {m.content && <span dangerouslySetInnerHTML={{ __html: formatMsg(m.content) }} />}
                  {m.heure && <span className="text-[10px] text-white/60 self-end">{m.heure}</span>}
                </div>
              </div>
            ))}
            {loading && (
              <div className="self-start flex items-center gap-2 text-[#b8905f] italic text-sm px-4">
                <span className="shining-star">✦</span> LuminZenith réfléchit...
              </div>
            )}
          </div>
        </div>

        <div className="border-t border-[#140f0b] shrink-0" style={{ background: '#020102' }}>
          {quotaInfo && !blocageActif && (quotaInfo.count / quotaInfo.cap) >= 0.9 && (
            <div className="flex items-center justify-between gap-3 px-4 pt-3 text-xs">
              <span className="text-amber-400/90">⚠ Tu approches de la limite de ton forfait ({quotaInfo.count}/{quotaInfo.cap} messages).</span>
              <button onClick={() => setPaywallOpen(true)} className="text-[#dcaaa0] underline shrink-0">Changer de forfait</button>
            </div>
          )}
          {attachedFile && (
            <div className="flex items-center gap-3 px-4 pt-3">
              <div className="relative">
                {attachedFile.type === 'image' ? (
                  <img src={attachedFile.dataUrl} alt={attachedFile.name} className="w-16 h-16 object-cover rounded-lg border border-[#16110c]" />
                ) : (
                  <video src={attachedFile.dataUrl} className="w-16 h-16 object-cover rounded-lg border border-[#16110c]" />
                )}
                <button onClick={removeAttachment}
                  className="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-black border border-[#16110c] text-[#b8905f] text-xs flex items-center justify-center">✕</button>
              </div>
              <span className="text-white/80 text-xs truncate">{attachedFile.name}</span>
            </div>
          )}
          <div className="flex gap-2 sm:gap-3 p-4 items-end">
            <input type="file" accept="image/*,video/*" ref={fileInputRef} onChange={handleFileSelect} className="hidden" />

            <button onClick={() => fileInputRef.current && fileInputRef.current.click()} title="Joindre une photo ou vidéo"
              className="shrink-0 w-11 h-11 rounded-lg border border-[#16110c] text-[#8f5f3d] flex items-center justify-center hover:border-[#8f5f3d] transition-colors">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
              </svg>
            </button>
            <button onClick={openCamera} title="Prendre une photo"
              className="shrink-0 w-11 h-11 rounded-lg border border-[#16110c] text-[#8f5f3d] flex items-center justify-center hover:border-[#8f5f3d] transition-colors">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                <circle cx="12" cy="13" r="4" />
              </svg>
            </button>
            <button onClick={toggleMic} title="Dicter un message"
              className={`shrink-0 w-11 h-11 rounded-lg border flex items-center justify-center transition-colors ${listening ? 'border-red-500 text-red-400 animate-pulse' : 'border-[#16110c] text-[#8f5f3d] hover:border-[#8f5f3d]'}`}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" y1="19" x2="12" y2="23" />
                <line x1="8" y1="23" x2="16" y2="23" />
              </svg>
            </button>

            <textarea ref={textareaRef} value={input}
              onChange={handleInputChange}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envoyer(); } }}
              placeholder="Écrivez votre message..."
              rows={2}
              style={{ maxHeight: '240px', overflowY: 'auto' }}
              className="flex-1 min-w-0 resize-none bg-[#0c0a07] border border-[#16110c] rounded-lg px-4 py-3 text-sm text-white leading-relaxed focus:outline-none focus:border-[#8f5f3d] focus:shadow-[0_0_14px_rgba(143,95,61,0.25)]" />
            <button onClick={() => envoyer()}
              className="btn-gold-outline shrink-0 px-4 sm:px-6 py-3 rounded-lg font-semibold text-sm hover:-translate-y-0.5 transition-all">
              <span className="btn-text-shine">Envoyer</span>
            </button>
          </div>
        </div>
      </div>

      {member && (
        <div className="hidden md:flex w-72 shrink-0 flex-col gap-4 p-5 border-l border-[#140f0b] overflow-y-auto" style={{ background: '#040302' }}>
          <div className="border border-[#8f5f3d] rounded-xl px-4 py-3 flex items-center gap-2 justify-center">
            <span className="text-[#b8905f]">💎</span>
            <span className="font-display text-xs text-white uppercase tracking-wide">Vision : 1 milliard</span>
          </div>

          <div className="border border-[#16110c] rounded-xl p-5 flex flex-col items-center text-center" style={{ background: '#0c0a07' }}>
            <div className="w-16 h-16 rounded-full flex items-center justify-center text-xl font-semibold text-[#150f0a] mb-3"
              style={{ background: 'linear-gradient(135deg,#dcc396,#b8905f,#8f6a45,#6e4a35)' }}>
              {(member.auth?.email || member.email || '?')[0].toUpperCase()}
            </div>
            <div className="text-white font-display text-base mb-2 truncate max-w-full">{member.auth?.email || member.email}</div>
            <span className="text-[10px] tracking-wide px-2 py-1 rounded-full border border-[#8f5f3d] text-[#8f5f3d] uppercase">Membre {forfait || 'aube'}</span>
          </div>

          {quotaInfo && (
            <div className="border border-[#16110c] rounded-xl p-4" style={{ background: '#0c0a07' }}>
              <div className="flex justify-between text-xs text-white/80 mb-1">
                <span>Messages utilisés</span>
                <span>{quotaInfo.count} / {quotaInfo.cap}</span>
              </div>
              <div className="w-full h-1.5 rounded-full bg-[#1a130f] overflow-hidden mb-4">
                <div className="h-full rounded-full" style={{ width: Math.min(100, (quotaInfo.count / quotaInfo.cap) * 100) + '%', background: 'linear-gradient(90deg,#b8905f,#8f5f3d)' }} />
              </div>
              <div className="flex justify-between text-xs text-white/80 mb-1">
                <span>Messages restants</span>
                <span>{Math.max(0, quotaInfo.cap - quotaInfo.count)}</span>
              </div>
              <div className="w-full h-1.5 rounded-full bg-[#1a130f] overflow-hidden">
                <div className="h-full rounded-full" style={{ width: Math.max(0, 100 - (quotaInfo.count / quotaInfo.cap) * 100) + '%', background: 'linear-gradient(90deg,#8f6a45,#6e4a35)' }} />
              </div>
            </div>
          )}

          <button onClick={() => setProfilOpen(true)}
            className="flex items-center justify-center gap-2 border border-[#16110c] hover:border-[#8f5f3d] rounded-lg py-2 text-sm text-white transition-colors">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
            Paramètres
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
