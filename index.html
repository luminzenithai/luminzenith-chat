<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{overflow-x:hidden!important;width:100%!important;max-width:100%!important;}
body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;overflow-x:hidden!important;font-family:'Source Serif 4',serif;background:#000;}
*{box-sizing:border-box;min-width:0;}
#root{width:100%;max-width:100%;overflow-x:hidden;}
.font-display{font-family:'Libre Bodoni',serif;letter-spacing:0.5px;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#4a3a1a;border-radius:10px;}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(0.6)}50%{opacity:1;transform:scale(1.6)}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-20px)}}
.star{animation:twinkle var(--dur,2.5s) ease-in-out infinite, drift var(--driftDur,7s) ease-in-out infinite alternate;}
@keyframes shoot{0%{transform:translate(0,0) rotate(-35deg);opacity:0}6%{opacity:1}50%{opacity:.85}82%{opacity:.3}100%{transform:translate(440px,308px) rotate(-35deg);opacity:0}}
.shooting-star{animation:shoot cubic-bezier(.3,.5,.4,1) infinite;}
@keyframes shine{to{background-position:200% center;}}
.text-shine{background:linear-gradient(90deg,#7a5c1e,#f4e2ac,#fff8e4,#f4e2ac,#7a5c1e);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;}
@keyframes pulseglow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
.glow-ring{animation:pulseglow 3.5s ease-in-out infinite;}
.logo-fade{
  -webkit-mask-image:radial-gradient(circle, black 45%, transparent 78%);
  mask-image:radial-gradient(circle, black 45%, transparent 78%);
}
</style>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const WORKER = 'https://luminzenithai-api.luminzenithai.workers.dev';

function getUserId() {
  let id = localStorage.getItem('luminzenith_uid');
  if (!id) {
    id = 'user_' + Math.random().toString(36).substring(2) + Date.now();
    localStorage.setItem('luminzenith_uid', id);
  }
  return id;
}

function getConversationsList() {
  const list = localStorage.getItem('luminzenith_convs');
  return list ? JSON.parse(list) : [];
}
function saveConversationsList(list) {
  localStorage.setItem('luminzenith_convs', JSON.stringify(list));
}
function creerNouvelleConversation() {
  const id = 'conv_' + Date.now();
  const list = getConversationsList();
  list.push({ id, titre: 'Nouvelle conversation' });
  saveConversationsList(list);
  localStorage.setItem('luminzenith_current_conv', id);
  return id;
}
function getCurrentConversationId() {
  let id = localStorage.getItem('luminzenith_current_conv');
  if (!id) id = creerNouvelleConversation();
  return id;
}

function StarField({ count = 90, shootingCount = 6, className = '' }) {
  const stars = useMemo(() => Array.from({ length: count }, () => ({
    top: Math.random() * 100, left: Math.random() * 100,
    dur: 1.2 + Math.random() * 2, driftDur: 3.5 + Math.random() * 4,
    delay: Math.random() * 3, size: Math.random() > 0.65 ? 4 : 2
  })), [count]);
  const shootingStars = useMemo(() => Array.from({ length: shootingCount }, () => ({
    top: Math.random() * 60, left: Math.random() * 70,
    delay: Math.random() * 6, dur: 3 + Math.random() * 2.5
  })), [shootingCount]);
  return (
    <div className={`absolute inset-0 overflow-hidden pointer-events-none ${className}`}>
      {stars.map((s, i) => (
        <div key={i} className="star absolute bg-[#fff3d6] rounded-full"
          style={{ top: s.top + '%', left: s.left + '%', width: s.size, height: s.size,
            animationDelay: s.delay + 's', '--dur': s.dur + 's', '--driftDur': s.driftDur + 's',
            boxShadow: '0 0 6px 1px rgba(244,226,172,0.9)' }} />
      ))}
      {shootingStars.map((s, i) => (
        <div key={'shoot'+i} className="shooting-star absolute w-32 h-[2px]"
          style={{ top: s.top + '%', left: s.left + '%', animationDelay: s.delay + 's', animationDuration: s.dur + 's',
            background: 'linear-gradient(90deg, transparent, #fff3d6, transparent)',
            boxShadow: '0 0 8px 2px rgba(244,226,172,0.6)' }} />
      ))}
    </div>
  );
}

function Splash({ onDone }) {
  const [fade, setFade] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setFade(true), 2200);
    const t2 = setTimeout(onDone, 3000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  return (
    <div className={`fixed inset-0 z-50 flex flex-col items-center justify-center transition-opacity duration-700 ${fade ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
      style={{ background: 'radial-gradient(circle at center, #0c0704 0%, #000 60%, #000 100%)' }}>
      <StarField count={160} shootingCount={10} />
      <div className="flex flex-col items-center justify-center text-center z-10 px-4 w-full">
        <div className="relative w-[26rem] h-[26rem] sm:w-[30rem] sm:h-[30rem] flex items-center justify-center mb-4">
          <div className="glow-ring absolute inset-0 rounded-full blur-3xl"
            style={{ background: 'radial-gradient(circle, rgba(244,226,172,0.5), transparent 70%)' }} />
          <img src="LuminZenith AI.png" alt="LuminZenith AI"
            className="logo-fade relative w-full h-full object-contain"
            style={{ mixBlendMode: 'screen' }} />
        </div>
        <h1 className="font-display text-shine text-3xl sm:text-4xl font-bold mb-2 uppercase">LuminZenith AI</h1>
        <p className="text-[#9c7a2e] text-xs tracking-[4px] uppercase font-display">La lumière au sommet</p>
      </div>
    </div>
  );
}

function AuthModal({ open, onClose, onAuthSuccess }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  if (!open) return null;

  async function submit() {
    setError('');
    if (!email || !password) { setError('Remplis tous les champs.'); return; }
    setLoading(true);
    try {
      const ms = window.$memberstackDom;
      if (!ms) { setError("Le service d'authentification n'est pas encore prêt. Réessaie dans un instant."); setLoading(false); return; }
      let res;
      if (mode === 'signup') {
        res = await ms.signupMemberEmailPassword({ email, password });
      } else {
        res = await ms.loginMemberEmailPassword({ email, password });
      }
      if (res && res.data) {
        onAuthSuccess(res.data.member || res.data);
        onClose();
      }
    } catch (e) {
      setError(e.message || "Une erreur s'est produite. Vérifie tes identifiants.");
    }
    setLoading(false);
  }

  return (
    <>
      <div onClick={onClose} className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50" />
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div className="relative w-full max-w-md rounded-2xl border border-[#2e2510] p-8"
          style={{ background: 'linear-gradient(160deg,#0c0704,#030201)' }}>
          <button onClick={onClose} className="absolute top-4 right-4 text-[#8a7040] hover:text-[#f4e2ac] text-xl">✕</button>

          <div className="text-center mb-6">
            <div className="w-14 h-14 mx-auto mb-3">
              <img src="LuminZenith AI.png" alt="logo" className="w-full h-full object-contain" style={{ mixBlendMode: 'screen' }} />
            </div>
            <h2 className="font-display text-2xl text-[#f4e2ac] uppercase">
              {mode === 'login' ? 'Connexion' : 'Créer un compte'}
            </h2>
          </div>

          <div className="flex mb-6 rounded-lg overflow-hidden border border-[#2e2510]">
            <button onClick={() => setMode('login')}
              className={`flex-1 py-2 text-sm font-display ${mode === 'login' ? 'text-[#1a1206]' : 'text-[#9c7a2e]'}`}
              style={mode === 'login' ? { background: 'linear-gradient(135deg,#fff3d6,#f4e2ac,#c9a227,#9c7a2e)' } : { background: '#0d0a05' }}>
              Se connecter
            </button>
            <button onClick={() => setMode('signup')}
              className={`flex-1 py-2 text-sm font-display ${mode === 'signup' ? 'text-[#1a1206]' : 'text-[#9c7a2e]'}`}
              style={mode === 'signup' ? { background: 'linear-gradient(135deg,#fff3d6,#f4e2ac,#c9a227,#9c7a2e)' } : { background: '#0d0a05' }}>
              S'inscrire
            </button>
          </div>

          <div className="flex flex-col gap-3">
            <input type="email" placeholder="Adresse email" value={email} onChange={e => setEmail(e.target.value)}
              className="bg-[#0d0a05] border border-[#2e2510] rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-[#d4af37]" />
            <input type="password" placeholder="Mot de passe" value={password} onChange={e => setPassword(e.target.value)}
              onKeyPress={e => e.key === 'Enter' && submit()}
              className="bg-[#0d0a05] border border-[#2e2510] rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-[#d4af37]" />

            {error && <p className="text-red-400 text-xs">{error}</p>}

            <button onClick={submit} disabled={loading}
              className="mt-2 py-3 rounded-lg font-semibold text-[#1a1206] text-sm shadow-[0_0_16px_rgba(212,175,55,0.4)] hover:shadow-[0_0_26px_rgba(212,175,55,0.7)] transition-all disabled:opacity-50"
              style={{ background: 'linear-gradient(135deg,#fff3d6,#f4e2ac,#c9a227,#9c7a2e)' }}>
              {loading ? 'Un instant...' : (mode === 'login' ? 'Se connecter' : "Créer mon compte")}
            </button>
          </div>

          <p className="text-center text-[#8a7040] text-xs mt-5">
            {mode === 'login' ? "Pas encore de compte ?" : "Déjà un compte ?"}{' '}
            <button onClick={() => setMode(mode === 'login' ? 'signup' : 'login')} className="text-[#d4af37] underline">
              {mode === 'login' ? "S'inscrire" : "Se connecter"}
            </button>
          </p>
        </div>
      </div>
    </>
  );
}

function Sidebar({ onOpenConversations, member, onOpenAuth, onLogout }) {
  const items = [
    { icon: '🏠', label: 'Accueil', active: true },
    { icon: '💬', label: 'Messages', onClick: onOpenConversations },
    { icon: '📞', label: 'Appels / Visio' },
    { icon: '📈', label: 'Activité' },
    { icon: '👤', label: 'Profil' },
  ];
  return (
    <div className="w-14 sm:w-56 shrink-0 flex flex-col py-6 border-r border-[#241d0d]" style={{ background: '#030201' }}>
      <div className="flex items-center gap-3 px-2 sm:px-5 pb-5 mb-4 border-b border-[#241d0d] justify-center sm:justify-start">
        <div className="relative w-9 h-9 shrink-0">
          <img src="LuminZenith AI.png" alt="logo" className="w-full h-full object-contain rounded-lg"
            style={{ mixBlendMode: 'screen', filter: 'drop-shadow(0 0 10px rgba(244,226,172,0.4))' }} />
        </div>
        <div className="hidden sm:block min-w-0">
          <div className="font-display text-[#f4e2ac] font-semibold text-sm leading-tight truncate">LuminZenith AI</div>
          <div className="text-[#8a7040] text-[9px] tracking-widest truncate font-display">LA LUMIÈRE AU SOMMET</div>
        </div>
      </div>
      {items.map((it, i) => (
        <div key={i} onClick={it.onClick}
          className={`flex items-center gap-3 px-2 sm:px-5 py-3 cursor-pointer text-sm border-l-2 justify-center sm:justify-start transition-colors
            ${it.active ? 'border-[#d4af37] text-[#f4e2ac] bg-[#d4af37]/10' : 'border-transparent text-stone-500 hover:text-[#f4e2ac] hover:bg-[#d4af37]/5'}`}>
          <span className="text-lg drop-shadow-[0_0_4px_rgba(212,175,55,0.5)] shrink-0">{it.icon}</span>
          <span className="hidden sm:inline truncate">{it.label}</span>
        </div>
      ))}

      <div className="mt-auto px-2 sm:px-5 pt-4 border-t border-[#241d0d]">
        {member ? (
          <div className="flex flex-col gap-2">
            <div className="hidden sm:block text-[#d4af37] text-xs truncate">{member.auth?.email || member.email}</div>
            <button onClick={onLogout}
              className="text-[11px] text-[#8a7040] hover:text-[#f4e2ac] text-center sm:text-left">
              Déconnexion
            </button>
          </div>
        ) : (
          <button onClick={onOpenAuth}
            className="w-full py-2 rounded-lg text-[11px] sm:text-xs font-semibold text-[#1a1206]"
            style={{ background: 'linear-gradient(135deg,#fff3d6,#f4e2ac,#c9a227,#9c7a2e)' }}>
            <span className="sm:hidden">👤</span>
            <span className="hidden sm:inline">Se connecter</span>
          </button>
        )}
      </div>
    </div>
  );
}

function ConversationsPanel({ open, onClose, current, onSelect }) {
  if (!open) return null;
  const list = getConversationsList().slice().reverse();
  return (
    <>
      <div onClick={onClose} className="fixed inset-0 bg-black/70 backdrop-blur-sm z-30" />
      <div className="fixed top-0 left-14 sm:left-56 w-64 max-w-[75vw] h-full z-40 p-4 border-r border-[#241d0d] overflow-y-auto"
        style={{ background: '#050301' }}>
        <h3 className="font-display text-[#f4e2ac] text-lg mb-4">Conversations</h3>
        {list.length === 0 && <p className="text-stone-600 text-sm">Aucune conversation encore.</p>}
        {list.map(c => (
          <div key={c.id} onClick={() => onSelect(c.id)}
            className={`p-3 rounded-lg mb-2 cursor-pointer text-sm border transition-colors truncate
              ${c.id === current ? 'border-[#d4af37] text-[#f4e2ac] shadow-[0_0_12px_rgba(212,175,55,0.25)]' : 'border-[#241d0d] text-stone-300 bg-black/40 hover:border-[#8a7040]'}`}>
            {c.titre}
          </div>
        ))}
      </div>
    </>
  );
}

function Hero() {
  return (
    <div className="relative flex flex-col items-center justify-center text-center py-12 px-4 border-b border-[#241d0d]/60 overflow-hidden shrink-0">
      <StarField count={100} shootingCount={7} />
      <div className="relative w-80 h-80 sm:w-96 sm:h-96 flex items-center justify-center mb-3">
        <div className="glow-ring absolute inset-0 rounded-full blur-3xl"
          style={{ background: 'radial-gradient(circle, rgba(244,226,172,0.45), transparent 70%)' }} />
        <img src="LuminZenith AI.png" alt="LuminZenith AI"
          className="relative w-full h-full object-contain z-10"
          style={{ mixBlendMode: 'screen' }} />
      </div>
      <h2 className="font-display text-shine text-xl sm:text-2xl font-bold relative z-10 uppercase">LuminZenith AI</h2>
      <p className="text-[#8a7040] text-xs tracking-[3px] uppercase mt-1 relative z-10 font-display">La lumière au sommet</p>
    </div>
  );
}

const QUICK_ACTIONS = [
  { icon: '💰', label: 'Business', prompt: "Aide-moi sur le business et la stratégie : " },
  { icon: '📱', label: 'Réseaux sociaux', prompt: "Aide-moi sur les réseaux sociaux : " },
  { icon: '📊', label: 'Investissement', prompt: "Aide-moi sur l'investissement : " },
  { icon: '🎨', label: 'Création', prompt: "Aide-moi sur la création et le design : " },
  { icon: '⚡', label: 'Automatisation', prompt: "Aide-moi à automatiser : " },
];

function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [convOpen, setConvOpen] = useState(false);
  const [authOpen, setAuthOpen] = useState(false);
  const [member, setMember] = useState(null);
  const [conversationId, setConversationId] = useState(getCurrentConversationId());
  const [messages, setMessages] = useState([
    { role: 'assistant', content: "Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?" }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [attachedFile, setAttachedFile] = useState(null);
  const [listening, setListening] = useState(false);
  const [cameraOpen, setCameraOpen] = useState(false);
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const userId = useRef(getUserId()).current;
  const scrollRef = useRef(null);
  const textareaRef = useRef(null);
  const fileInputRef = useRef(null);
  const recognitionRef = useRef(null);

  function handleInputChange(e) {
    setInput(e.target.value);
    const el = e.target;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 240) + 'px';
  }

  function handleFileSelect(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const isVideo = file.type.startsWith('video/');
    const reader = new FileReader();
    reader.onload = () => {
      setAttachedFile({ dataUrl: reader.result, type: isVideo ? 'video' : 'image', name: file.name });
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function removeAttachment() {
    setAttachedFile(null);
  }

  async function openCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      streamRef.current = stream;
      setCameraOpen(true);
      setTimeout(() => {
        if (videoRef.current) videoRef.current.srcObject = stream;
      }, 0);
    } catch (e) {
      alert("Impossible d'accéder à la caméra. Vérifie que l'accès est autorisé pour ce site.");
    }
  }

  function closeCamera() {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach(t => t.stop());
      streamRef.current = null;
    }
    setCameraOpen(false);
  }

  function capturePhoto() {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/png');
    setAttachedFile({ dataUrl, type: 'image', name: 'photo.png' });
    closeCamera();
  }

  function toggleMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("La dictée vocale n'est pas prise en charge par ce navigateur.");
      return;
    }
    if (listening) {
      recognitionRef.current && recognitionRef.current.stop();
      setListening(false);
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = (event) => {
      let texteRecu = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        texteRecu += event.results[i][0].transcript;
      }
      setInput(prev => {
        const nouveau = (prev ? prev + ' ' : '') + texteRecu;
        setTimeout(() => {
          if (textareaRef.current) {
            textareaRef.current.style.height = 'auto';
            textareaRef.current.style.height = Math.min(textareaRef.current.scrollHeight, 240) + 'px';
          }
        }, 0);
        return nouveau;
      });
    };
    recognition.onend = () => setListening(false);
    recognition.onerror = (event) => {
      setListening(false);
      const messages = {
        'not-allowed': "L'accès au micro a été refusé. Autorise le micro pour ce site dans les réglages du navigateur.",
        'audio-capture': "Aucun micro détecté sur cet appareil.",
        'network': "Le service de reconnaissance vocale n'a pas pu être joint (connexion réseau).",
        'service-not-allowed': "Le service de dictée vocale est désactivé ou bloqué sur cet appareil."
      };
      alert(messages[event.error] || ("Erreur du micro : " + event.error));
    };
    recognitionRef.current = recognition;
    try {
      recognition.start();
      setListening(true);
    } catch (e) {
      alert("Impossible de démarrer le micro : " + e.message);
      setListening(false);
    }
  }

  useEffect(() => {
    const checkMember = async () => {
      try {
        if (window.$memberstackDom) {
          const res = await window.$memberstackDom.getCurrentMember();
          if (res && res.data) setMember(res.data);
        }
      } catch (e) {}
    };
    setTimeout(checkMember, 800);
  }, []);

  useEffect(() => { chargerHistorique(); }, [conversationId]);
  useEffect(() => { scrollRef.current?.scrollTo(0, scrollRef.current.scrollHeight); }, [messages, loading]);

  async function chargerHistorique() {
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [], userId, conversationId, chargerSeulement: true })
      });
      const data = await r.json();
      if (data.historique && data.historique.length > 0) {
        setMessages(data.historique);
      } else {
        setMessages([{ role: 'assistant', content: "Bonjour ! Je suis LuminZenith AI. Comment puis-je vous aider aujourd'hui ?" }]);
      }
    } catch (e) { console.log('Pas d\'historique existant.'); }
  }

  function mettreAJourTitreConversation(premierMessage) {
    const list = getConversationsList();
    const conv = list.find(c => c.id === conversationId);
    if (conv && conv.titre === 'Nouvelle conversation') {
      conv.titre = premierMessage.substring(0, 30) + (premierMessage.length > 30 ? '...' : '');
      saveConversationsList(list);
    }
  }

  async function envoyer(texteOverride) {
    const texte = (texteOverride ?? input).trim();
    if (!texte && !attachedFile) return;
    const fichierEnvoye = attachedFile;
    const nouvMessage = { role: 'user', content: texte, attachment: fichierEnvoye };
    const nouvHist = [...messages, nouvMessage];
    setMessages(nouvHist);
    setInput('');
    setAttachedFile(null);
    if (textareaRef.current) textareaRef.current.style.height = 'auto';
    mettreAJourTitreConversation(texte || (fichierEnvoye ? fichierEnvoye.name : 'Pièce jointe'));
    setLoading(true);
    try {
      const r = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: nouvHist, userId, conversationId, image: fichierEnvoye ? fichierEnvoye.dataUrl : undefined })
      });
      const rep = await r.text();
      setMessages(h => [...h, { role: 'assistant', content: rep }]);
    } catch (e) {
      setMessages(h => [...h, { role: 'assistant', content: 'Erreur de connexion.' }]);
    }
    setLoading(false);
  }

  function nouvelleConv() {
    const id = creerNouvelleConversation();
    setConversationId(id);
    setConvOpen(false);
  }
  function ouvrirConversation(id) {
    localStorage.setItem('luminzenith_current_conv', id);
    setConversationId(id);
    setConvOpen(false);
  }
  function formatMsg(text) {
    return text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  }

  async function handleLogout() {
    try {
      if (window.$memberstackDom) await window.$memberstackDom.logout();
    } catch (e) {}
    setMember(null);
  }

  return (
    <div className="flex h-screen w-full text-white overflow-hidden">
      {showSplash && <Splash onDone={() => setShowSplash(false)} />}
      <AuthModal open={authOpen} onClose={() => setAuthOpen(false)} onAuthSuccess={setMember} />
      {cameraOpen && (
        <>
          <div onClick={closeCamera} className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50" />
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div className="relative w-full max-w-lg rounded-2xl border border-[#2e2510] p-5 flex flex-col items-center gap-4"
              style={{ background: 'linear-gradient(160deg,#0c0704,#030201)' }}>
              <button onClick={closeCamera} className="absolute top-3 right-3 text-[#8a7040] hover:text-[#f4e2ac] text-xl">✕</button>
              <video ref={videoRef} autoPlay playsInline className="w-full rounded-lg bg-black" />
              <canvas ref={canvasRef} className="hidden" />
              <button onClick={capturePhoto}
                className="px-6 py-3 rounded-lg font-semibold text-[#1a1206] text-sm shadow-[0_0_16px_rgba(212,175,55,0.4)] hover:shadow-[0_0_26px_rgba(212,175,55,0.7)] transition-all"
                style={{ background: 'linear-gradient(135deg,#fff3d6,#f4e2ac,#c9a227,#9c7a2e)' }}>
                Capturer
              </button>
            </div>
          </div>
        </>
      )}
      <Sidebar onOpenConversations={() => setConvOpen(true)} member={member} onOpenAuth={() => setAuthOpen(true)} onLogout={handleLogout} />
      <ConversationsPanel open={convOpen} onClose={() => setConvOpen(false)} current={conversationId} onSelect={ouvrirConversation} />

      <div className="flex-1 flex flex-col min-w-0 overflow-hidden" style={{ background: 'radial-gradient(circle at 50% 0%,#090604 0%,#000 60%)' }}>
        <header className="relative flex items-center justify-center py-4 px-14 sm:px-16 border-b border-[#241d0d] shadow-lg shrink-0"
          style={{ background: '#050301' }}>
          <button onClick={() => setConvOpen(true)}
            className="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 border border-[#8a7040] text-[#d4af37] text-[11px] sm:text-xs px-2 sm:px-3 py-2 rounded-lg hover:border-[#d4af37] transition-colors whitespace-nowrap">
            ☰ <span className="hidden sm:inline">Conversations</span>
          </button>
          <span className="font-display text-shine text-sm sm:text-xl font-bold truncate max-w-full uppercase">✦ LuminZenith AI</span>
          <button onClick={nouvelleConv}
            className="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 text-[11px] sm:text-xs font-semibold px-2 sm:px-3 py-2 rounded-lg text-[#1a1206] shadow-[0_0_14px_rgba(212,175,55,0.4)] hover:shadow-[0_0_22px_rgba(212,175,55,0.7)] transition-shadow whitespace-nowrap"
            style={{ background: 'linear-gradient(135deg,#fff3d6,#f4e2ac,#c9a227,#9c7a2e)' }}>
            + <span className="hidden sm:inline">Nouvelle conversation</span>
          </button>
        </header>

        <div className="overflow-y-auto overflow-x-hidden flex-1 flex flex-col min-h-0">
          <Hero />

          <div className="flex gap-3 overflow-x-auto overflow-y-hidden px-5 py-4 border-b border-[#241d0d]/50 shrink-0">
            {QUICK_ACTIONS.map((qa, i) => (
              <div key={i} onClick={() => setInput(qa.prompt)}
                className="min-w-[110px] shrink-0 text-center rounded-xl border border-[#2e2510] px-3 py-4 cursor-pointer text-[#d4af37] text-xs hover:border-[#d4af37] hover:shadow-[0_0_18px_rgba(212,175,55,0.3)] hover:-translate-y-0.5 transition-all"
                style={{ background: '#0d0a05' }}>
                <div className="text-2xl mb-2 drop-shadow-[0_0_6px_rgba(212,175,55,0.5)]">{qa.icon}</div>
                {qa.label}
              </div>
            ))}
          </div>

          <div ref={scrollRef} className="flex-1 px-5 sm:px-10 py-5 flex flex-col gap-3 min-w-0 max-w-5xl mx-auto w-full">
            {messages.map((m, i) => (
              <div key={i}
                className={`max-w-[600px] w-fit px-4 py-3 rounded-2xl text-sm leading-relaxed break-words flex flex-col gap-2
                  ${m.role === 'user'
                    ? 'self-end bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700'
                    : 'self-start border border-[#2e2510] text-[#f0dcae]'}`}
                style={m.role === 'assistant' ? { background: '#0d0a05' } : {}}>
                {m.attachment && m.attachment.type === 'image' && (
                  <img src={m.attachment.dataUrl} alt={m.attachment.name} className="max-w-[260px] max-h-[260px] rounded-lg object-contain" />
                )}
                {m.attachment && m.attachment.type === 'video' && (
                  <video src={m.attachment.dataUrl} controls className="max-w-[260px] max-h-[260px] rounded-lg" />
                )}
                {m.content && <span dangerouslySetInnerHTML={{ __html: formatMsg(m.content) }} />}
              </div>
            ))}
            {loading && <div className="self-start text-[#9c7a2e] italic text-sm px-4">LuminZenith réfléchit...</div>}
          </div>
        </div>

        <div className="border-t border-[#241d0d] shrink-0" style={{ background: '#030201' }}>
          {attachedFile && (
            <div className="flex items-center gap-3 px-4 pt-3">
              <div className="relative">
                {attachedFile.type === 'image' ? (
                  <img src={attachedFile.dataUrl} alt={attachedFile.name} className="w-16 h-16 object-cover rounded-lg border border-[#2e2510]" />
                ) : (
                  <video src={attachedFile.dataUrl} className="w-16 h-16 object-cover rounded-lg border border-[#2e2510]" />
                )}
                <button onClick={removeAttachment}
                  className="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-black border border-[#2e2510] text-[#f4e2ac] text-xs flex items-center justify-center">✕</button>
              </div>
              <span className="text-[#8a7040] text-xs truncate">{attachedFile.name}</span>
            </div>
          )}
          <div className="flex gap-2 sm:gap-3 p-4 items-end">
            <input type="file" accept="image/*,video/*" ref={fileInputRef} onChange={handleFileSelect} className="hidden" />

            <button onClick={() => fileInputRef.current && fileInputRef.current.click()} title="Joindre une photo ou vidéo"
              className="shrink-0 w-11 h-11 rounded-lg border border-[#2e2510] text-[#d4af37] flex items-center justify-center hover:border-[#d4af37] transition-colors">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
              </svg>
            </button>
            <button onClick={openCamera} title="Prendre une photo"
              className="shrink-0 w-11 h-11 rounded-lg border border-[#2e2510] text-[#d4af37] flex items-center justify-center hover:border-[#d4af37] transition-colors">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                <circle cx="12" cy="13" r="4" />
              </svg>
            </button>
            <button onClick={toggleMic} title="Dicter un message"
              className={`shrink-0 w-11 h-11 rounded-lg border flex items-center justify-center transition-colors ${listening ? 'border-red-500 text-red-400 animate-pulse' : 'border-[#2e2510] text-[#d4af37] hover:border-[#d4af37]'}`}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" y1="19" x2="12" y2="23" />
                <line x1="8" y1="23" x2="16" y2="23" />
              </svg>
            </button>

            <textarea ref={textareaRef} value={input}
              onChange={handleInputChange}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envoyer(); } }}
              placeholder="Écrivez votre message..."
              rows={2}
              style={{ maxHeight: '240px', overflowY: 'auto' }}
              className="flex-1 min-w-0 resize-none bg-[#0d0a05] border border-[#2e2510] rounded-lg px-4 py-3 text-sm text-white leading-relaxed focus:outline-none focus:border-[#d4af37] focus:shadow-[0_0_14px_rgba(212,175,55,0.25)]" />
            <button onClick={() => envoyer()}
              className="shrink-0 px-4 sm:px-6 py-3 rounded-lg font-semibold text-[#1a1206] text-sm shadow-[0_0_16px_rgba(212,175,55,0.4)] hover:shadow-[0_0_26px_rgba(212,175,55,0.7)] hover:-translate-y-0.5 transition-all"
              style={{ background: 'linear-gradient(135deg,#fff3d6,#f4e2ac,#c9a227,#9c7a2e)' }}>
              Envoyer
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
